<!-- Main CSS -->
<link rel="stylesheet" href="../assets/style.css">

<style>
/* =========================================================
   DEVELOPER CONNECT
   ========================================================= */

.developer-connect {
  padding-top: 8px;
  padding-bottom: 40px;
}

.developer-connect .wrap {
  width: 100%;
}

.developer-btn {
  width: 100%;
  min-height: 68px;
  padding: 0 26px;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;

  box-sizing: border-box;

  border-radius: 16px;

  background: var(--brand);
  color: #ffffff;

  text-decoration: none;

  font-family: "Space Grotesk", sans-serif;
  font-size: 18px;
  font-weight: 700;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    opacity 0.2s ease;
}

.developer-btn:hover {
  transform: translateY(-2px);
  opacity: 0.96;
  box-shadow: 0 12px 30px rgba(0, 135, 196, 0.20);
}

.developer-btn:active {
  transform: translateY(0);
}

.developer-btn-text {
  display: flex;
  align-items: center;
  gap: 10px;
}

.developer-icon {
  width: 34px;
  height: 34px;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(255, 255, 255, 0.14);

  font-size: 17px;
}

.developer-arrow {
  font-size: 26px;
  line-height: 1;
  flex-shrink: 0;
}

/* Mobile */
@media (max-width: 600px) {

  .developer-connect {
    padding-top: 4px;
    padding-bottom: 28px;
  }

  .developer-btn {
    min-height: 62px;
    padding: 0 18px;

    border-radius: 14px;

    font-size: 16px;
  }

  .developer-icon {
    width: 30px;
    height: 30px;
    font-size: 15px;
  }

  .developer-arrow {
    font-size: 23px;
  }
}
</style>

</head>

<body data-page="contact" data-root="../">

<!-- Header -->
<div id="hdr-slot"></div>

<main>

  <!-- =====================================================
       PAGE HEADER
       ====================================================== -->

  <section class="ph">
    <div class="wrap">

      <h1>Contact us</h1>

      <p>
        Questions, hiring or services?
        We reply quickly on WhatsApp.
      </p>

    </div>
  </section>


  <!-- =====================================================
       CONTACT SECTION
       ====================================================== -->

  <section class="sec" style="padding-top:8px">

    <div class="wrap two">

      <!-- Contact Form -->
      <form class="form" id="cform">

        <div class="field">

          <label for="name">
            Your name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            required
          >

        </div>


        <div class="field">

          <label for="contact">
            Phone or email
          </label>

          <input
            id="contact"
            name="contact"
            type="text"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="msg">
            Message
          </label>

          <textarea
            id="msg"
            name="message"
            rows="5"
            required
          ></textarea>

        </div>


        <button
          class="btn wa"
          type="submit"
        >
          Send via WhatsApp
        </button>


        <div
          class="ok-msg"
          id="ok"
          role="status"
        >
          Thank you! Your message is ready on WhatsApp.
          Press send there.
        </div>

      </form>


      <!-- =================================================
           CONTACT INFORMATION
           ================================================== -->

      <div class="info">

        <h2 style="font-size:26px;margin-bottom:10px">
          Other ways to reach us
        </h2>


        <p>
          <b>WhatsApp:</b>

          <a
            data-wa
            href="#"
            style="
              color:var(--brand);
              font-weight:600;
            "
          >
            Chat now
          </a>
        </p>


        <p>
          <b>Email:</b>

          <a
            href="mailto:info@digiserbd.com"
            style="
              color:var(--brand);
              font-weight:600;
            "
          >
            info@digiserbd.com
          </a>
        </p>


        <p>
          <b>Location:</b>

          <span>
            Dhaka, Bangladesh
          </span>
        </p>

      </div>

    </div>

  </section>


  <!-- =====================================================
       DEVELOPER CONNECT
       FOOTER-ER THIK UPOR
       ====================================================== -->

  <section class="sec developer-connect">

    <div class="wrap">

      <a
        href="https://www.snkbp.com"
        target="_blank"
        rel="noopener noreferrer"
        class="developer-btn"
        aria-label="Connect with Developer"
      >

        <span class="developer-btn-text">

          <span class="developer-icon">
            ↗
          </span>

          <span>
            Connect with Developer
          </span>

        </span>

        <span class="developer-arrow">
          →
        </span>

      </a>

    </div>

  </section>

</main>


<!-- Footer -->
<div id="ftr-slot"></div>


<!-- Scripts -->
<script src="../assets/data.js"></script>
<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>

</body>
</html>
