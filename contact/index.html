<section class="contact-section">
  <div class="wrap">

    <div class="contact-box">

      <div class="contact-content">

        <div class="contact-heading">
          <span>CONTACT DIGISER BD</span>

          <h1>Send us a message</h1>

          <p>
            Questions, hiring or services?
            Send us a message and our team will get back to you shortly.
          </p>
        </div>


        <form id="contactForm" class="contact-form">

          <div class="field">
            <label for="contactName">Your name *</label>

            <input
              id="contactName"
              name="name"
              type="text"
              placeholder="Enter your name"
              required
            >
          </div>


          <div class="field">
            <label for="contactContact">Phone or email *</label>

            <input
              id="contactContact"
              name="contact"
              type="text"
              placeholder="Phone number or email"
              required
            >
          </div>


          <div class="field">
            <label for="contactMessage">Message *</label>

            <textarea
              id="contactMessage"
              name="message"
              rows="6"
              placeholder="How can we help you?"
              required
            ></textarea>
          </div>


          <button
            type="submit"
            class="contact-submit"
            id="contactSubmitBtn"
          >
            <span>Send Message</span>
            <span>→</span>
          </button>


          <div
            id="contactSuccess"
            class="contact-success"
          >
            <strong>✓ Message submitted successfully</strong>

            <br><br>

            আপনার মেসেজটি Admin Dashboard-এ
            পাঠানো হয়েছে।
          </div>

        </form>

      </div>


      <!-- Developer Connect -->

      <a
        href="https://snkbp.com/"
        target="_blank"
        rel="noopener"
        class="developer-connect"
      >

        <div>
          <small>
            NEED A WEBSITE OR DIGITAL SOLUTION?
          </small>

          <strong>
            Developer Connect
          </strong>
        </div>

        <span class="developer-arrow">
          ↗
        </span>

      </a>

    </div>

  </div>
</section>
