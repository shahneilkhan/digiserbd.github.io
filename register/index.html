<div id="hdr-slot"></div>
<main>
<section class="ph"><div class="wrap"><h1>Register</h1><p>Join as a job seeker, employee, business or service provider.</p></div></section>
<section class="sec" style="padding-top:8px"><div class="wrap">
  <form class="form" id="rform">
    <div class="note">Online accounts are coming soon. Send your details on WhatsApp and we will contact you when your account is ready.</div>
    <div class="field"><label for="name">Full name</label><input id="name" required></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" type="tel" required></div>
    <div class="field"><label for="email">Email (optional)</label><input id="email" type="email"></div>
    <div class="field"><label for="type">I am a</label><select id="type"><option value="Job seeker">Job seeker</option><option value="Employee / Freelancer">Employee / Freelancer</option><option value="Business">Business</option><option value="Service provider">Service provider</option></select></div>
    <button class="btn wa" type="submit">Send via WhatsApp</button>
    <div class="ok-msg" id="ok">Thank you! Your details are ready on WhatsApp. Press send there.</div>
  </form>
</div></section>
</main>
<div id="ftr-slot"></div>
