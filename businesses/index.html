<head>
<meta charset="UTF-8">

<meta name="description" content="List your local business or find local businesses in Bangladesh.">
<meta name="theme-color" content="#0087c4">
<link rel="canonical" href="https://digiserbd.com/businesses/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="DigiSER BD">
<meta property="og:title" content="Local Businesses | DigiSER BD">
<meta property="og:description" content="List your local business or find local businesses in Bangladesh.">
<meta property="og:url" content="https://digiserbd.com/businesses/">
<meta property="og:image" content="https://digiserbd.com/logo.png">
<meta name="twitter:card" content="summary">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

</head>
<body data-page="businesses" data-root="../">
<div id="hdr-slot"></div>
<main>
<section class="ph"><div class="wrap"><h1>Local businesses</h1><p>Support local. Find businesses or list your own.</p></div></section>
<section class="sec" style="padding-top:8px"><div class="wrap">
<div class="filters"><input id="q" type="search" placeholder="Search businesses..." aria-label="Search businesses..."><span id="count" style="align-self:center;color:var(--muted)"></span></div>
  <div id="list"></div>
</div></section>
<section class="sec alt"><div class="wrap two">
  <div class="info"><h2 style="font-size:28px;margin-bottom:8px">List your business</h2><p>Tell us about your business and we will contact you to get it listed.</p></div>
  <form class="form" id="bform">
    <div class="field"><label for="bname">Business name</label><input id="bname" required></div>
    <div class="field"><label for="bcat">Category</label><input id="bcat" placeholder="e.g. Restaurant, Shop, Agency"></div>
    <div class="field"><label for="bphone">Phone</label><input id="bphone" type="tel" required></div>
    <button class="btn wa" type="submit">Send via WhatsApp</button>
    <div class="ok-msg" id="bok">Thank you! Your details are ready on WhatsApp. Press send there.</div>
  </form>
</div></section>
</main>
<div id="ftr-slot"></div>
<script src="../assets/data.js"></script>
<script src="../assets/i18n.js"></script>
<script src="../assets/app.js"></script>
</body>
</html>
