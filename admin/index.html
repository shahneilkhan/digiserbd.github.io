<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiSER BD · Admin Dashboard</title>

<meta name="description" content="DigiSER BD administration dashboard">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<style>
:root{
  --primary:#0087c4;
  --primary-dark:#006d9f;
  --bg:#f4f7f9;
  --card:#fff;
  --text:#172833;
  --muted:#71808a;
  --border:#dce5ea;
  --danger:#d33b3b;
  --success:#16834b;
  --shadow:0 12px 35px rgba(18,35,45,.07);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:"Hind Siliguri",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   LOGIN
========================= */

.login-screen{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:
    radial-gradient(
      circle at top right,
      rgba(0,135,196,.16),
      transparent 35%
    ),
    #07151d;
}

.login-box{
  width:min(410px,100%);

  padding:32px;

  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;

  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.login-brand{
  margin-bottom:28px;
}

.login-brand strong{
  font-family:"Space Grotesk",sans-serif;
  font-size:25px;
}

.login-brand span{
  color:var(--primary);
}

.login-brand p{
  margin:7px 0 0;
  color:var(--muted);
}

.login-box label{
  display:block;
  margin-bottom:7px;
  font-size:14px;
  font-weight:600;
}

.login-box input{
  width:100%;
  padding:13px;

  border:1px solid var(--border);
  border-radius:10px;

  outline:none;
}

.login-box input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(0,135,196,.1);
}

.login-btn{
  width:100%;
  margin-top:15px;

  padding:13px;

  border:0;
  border-radius:10px;

  background:var(--primary);
  color:#fff;

  font-family:"Space Grotesk",sans-serif;
  font-weight:700;
}

.login-error{
  display:none;
  margin-top:12px;
  color:var(--danger);
  font-size:13px;
}

.login-error.show{
  display:block;
}

/* =========================
   APP
========================= */

.app{
  display:none;
  min-height:100vh;
}

.app.active{
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  inset:0 auto 0 0;
  z-index:100;

  width:245px;

  background:#09202b;
  color:#fff;

  padding:22px 15px;

  overflow-y:auto;
}

.brand{
  padding:4px 10px 25px;

  font-family:"Space Grotesk",sans-serif;
  font-size:21px;
  font-weight:700;
}

.brand span{
  color:#42c6f1;
}

.nav-title{
  padding:15px 10px 7px;

  color:#78909c;

  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
}

.nav button{
  width:100%;

  display:flex;
  align-items:center;
  gap:10px;

  margin:3px 0;
  padding:11px 12px;

  border:0;
  border-radius:9px;

  background:transparent;
  color:#c9d7dd;

  text-align:left;
}

.nav button:hover,
.nav button.active{
  background:rgba(255,255,255,.09);
  color:#fff;
}

.sidebar-bottom{
  margin-top:25px;
  padding-top:20px;

  border-top:1px solid rgba(255,255,255,.09);
}

.logout{
  width:100%;
  padding:10px;

  border:1px solid rgba(255,255,255,.12);
  border-radius:9px;

  background:transparent;
  color:#fff;
}

/* =========================
   MAIN
========================= */

.main{
  width:calc(100% - 245px);
  margin-left:245px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;

  min-height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:12px 25px;

  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--border);

  backdrop-filter:blur(10px);
}

.topbar h1{
  margin:0;

  font-family:"Space Grotesk",sans-serif;
  font-size:21px;
}

.menu-btn{
  display:none;

  border:0;
  background:none;

  font-size:24px;
}

.content{
  padding:25px;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;

  margin-bottom:25px;
}

.stat{
  padding:20px;

  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;

  box-shadow:var(--shadow);
}

.stat small{
  color:var(--muted);
  font-size:13px;
}

.stat strong{
  display:block;
  margin-top:5px;

  font-family:"Space Grotesk",sans-serif;
  font-size:29px;
}

/* =========================
   PANELS
========================= */

.panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);

  overflow:hidden;
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  padding:18px 20px;

  border-bottom:1px solid var(--border);
}

.panel-head h2{
  margin:0;

  font-family:"Space Grotesk",sans-serif;
  font-size:18px;
}

.panel-body{
  padding:20px;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:13px 14px;

  border-bottom:1px solid #edf1f3;

  text-align:left;
  white-space:nowrap;

  font-size:13px;
}

th{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

tr:last-child td{
  border-bottom:0;
}

/* =========================
   BUTTONS
========================= */

.btn{
  padding:8px 12px;

  border:1px solid var(--border);
  border-radius:8px;

  background:#fff;
  color:var(--text);

  font-size:12px;
  font-weight:600;
}

.btn:hover{
  border-color:#b9cbd4;
}

.btn.pri{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
}

.btn.del{
  color:var(--danger);
}

.btn.sm{
  padding:6px 9px;
}

.acts{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

/* =========================
   STATUS
========================= */

.status{
  display:inline-flex;
  align-items:center;

  padding:4px 8px;

  border-radius:999px;

  background:#eef3f5;
  color:#52636c;

  font-size:11px;
  font-weight:700;
}

.status.new,
.status.pending{
  background:#fff5d8;
  color:#8b6500;
}

.status.approved,
.status.active{
  background:#e6f7ed;
  color:#167044;
}

.status.rejected,
.status.closed{
  background:#fdeaea;
  color:#b12f2f;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:1000;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(3,16,23,.65);
}

.modal.open{
  display:flex;
}

.modal-box{
  width:min(900px,100%);
  max-height:92vh;

  background:#fff;
  border-radius:18px;

  box-shadow:0 30px 90px rgba(0,0,0,.3);

  overflow:hidden;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:17px 20px;

  border-bottom:1px solid var(--border);
}

.modal-head h3{
  margin:0;
  font-family:"Space Grotesk",sans-serif;
}

.modal-close{
  width:34px;
  height:34px;

  border:0;
  border-radius:8px;

  background:#edf2f4;
  font-size:20px;
}

.modal-body{
  max-height:calc(92vh - 125px);
  overflow-y:auto;

  padding:20px;
}

.detail-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.detail{
  padding:13px;

  border:1px solid var(--border);
  border-radius:10px;

  background:#fafcfd;
}

.detail.full{
  grid-column:1/-1;
}

.detail small{
  display:block;

  margin-bottom:3px;

  color:var(--muted);
  font-size:11px;
}

.detail strong{
  font-size:14px;
  white-space:pre-line;
}

.modal-foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;

  padding:14px 20px;

  border-top:1px solid var(--border);
}

/* =========================
   CV
========================= */

.cv-wrap{
  background:#edf1f3;
  padding:20px;
}

.cv-paper{
  width:210mm;
  min-height:297mm;
  max-width:100%;

  margin:auto;

  background:#fff;

  box-shadow:0 12px 40px rgba(0,0,0,.13);

  overflow:hidden;
}

.cv-head{
  padding:32px;

  background:#0d2634;
  color:#fff;
}

.cv-head h1{
  margin:0;

  font-family:"Space Grotesk",sans-serif;
  font-size:31px;
}

.cv-role{
  margin-top:5px;
  color:#8edcff;
  font-weight:600;
}

.cv-contact{
  display:flex;
  flex-wrap:wrap;
  gap:8px 18px;

  margin-top:14px;

  color:#d4e1e8;
  font-size:12px;
}

.cv-content{
  display:grid;
  grid-template-columns:1fr 190px;
  gap:25px;

  padding:28px 32px;
}

.cv-section{
  margin-bottom:22px;
}

.cv-section h4{
  margin:0 0 9px;

  color:var(--primary);

  font-family:"Space Grotesk",sans-serif;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.cv-section p{
  margin:0;

  color:#43545e;

  font-size:12px;
  line-height:1.6;
  white-space:pre-line;
}

.cv-item{
  margin-bottom:12px;
}

.cv-item strong{
  display:block;
  font-size:12px;
}

.cv-item span{
  display:block;
  margin-top:2px;
  color:#73828a;
  font-size:11px;
}

.cv-side{
  border-left:1px solid #e1e8ec;
  padding-left:18px;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:45px 20px;

  color:var(--muted);

  text-align:center;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:5000;

  display:none;

  padding:12px 16px;

  background:#102b38;
  color:#fff;

  border-radius:10px;

  box-shadow:0 12px 35px rgba(0,0,0,.2);

  font-size:13px;
}

.toast.show{
  display:block;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1050px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:800px){

  .sidebar{
    transform:translateX(-100%);
    transition:transform .2s ease;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    width:100%;
    margin-left:0;
  }

  .menu-btn{
    display:block;
  }

  .content{
    padding:15px;
  }

  .topbar{
    padding:12px 15px;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }

  .detail.full{
    grid-column:auto;
  }

  .cv-paper{
    width:100%;
  }

  .cv-content{
    grid-template-columns:1fr;
  }

  .cv-side{
    border-left:0;
    border-top:1px solid #e1e8ec;
    padding:18px 0 0;
  }

}

@media(max-width:500px){

  .stats{
    grid-template-columns:1fr;
  }

  .login-box{
    padding:24px;
  }

}
</style>
</head>

<body>

<!-- =====================================================
     LOGIN
===================================================== -->

<div class="login-screen" id="loginScreen">

  <div class="login-box">

    <div class="login-brand">

      <strong>

    </div>

      <input

      </button>

      <div

        Incorrect password.
      </div>

    </form>

  </div>

</div>


<!-- =====================================================
     APP
===================================================== -->

<div class="app" id="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      DigiSER <span>BD</span>
    </div>

    <div class="nav-title">
      Management
    </div>

    <nav class="nav">

      <button
        class="active"
        data-section="dashboard"
      >
        📊 Dashboard
      </button>

      <button data-section="jobs">
        💼 Jobs
      </button>

      <button data-section="services">
        🛠 Services
      </button>

      <button data-section="employees">
        👥 Employees
      </button>

      <button data-section="businesses">
        🏢 Businesses
      </button>

      <button data-section="messages">
        💬 Messages
      </button>

      <button data-section="blog">
        📝 Blog
      </button>

      <button data-section="applicants">
        📄 Applicants
      </button>

    </nav>

    <div class="sidebar-bottom">

      <button
        class="logout"
        id="logoutBtn"

        Logout
      </button>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div style="display:flex;align-items:center;gap:12px">

        <button
          class="menu-btn"
          id="menuBtn"
        >
          ☰
        </button>

        <h1 id="pageTitle">

        </h1>

      </div>

          <div class="stat">

      <!-- =====================

      ====================== -->

      <section

        <div class="panel">

          <div class="panel-head">

          <div

      <!-- =====================
           BLOG
      ====================== -->

      <section
        class="section-view hidden"

      ====================== -->

            <h2>
              Applicants
            </h2>

          <div
            class="table-wrap"
            id="applicantsTable"

    </div>

  </main>

</div>

     APPLICANT MODAL
===================================================== -->

     CV MODAL

>

<script>

/* =========================================================
   DIGISER BD ADMIN
========================================================= */

const STORAGE_KEY =
  "digiserbd_admin_v1";

const ADMIN_PASSWORD =
  "digiser2026";

let db = loadDB();

let currentApplicantId = null;


/* =========================================================
   DATABASE
========================================================= */

function loadDB(){

  try{

    const raw =
      localStorage.getItem(STORAGE_KEY);

    if(raw){

      const data =
        JSON.parse(raw);

      return {

        users:Array.isArray(data.users)
          ? data.users
          : [],

        jobs:Array.isArray(data.jobs)
          ? data.jobs
          : [],

        services:Array.isArray(data.services)
          ? data.services
          : [],

        employees:Array.isArray(data.employees)
          ? data.employees
          : [],

        businesses:Array.isArray(data.businesses)
          ? data.businesses
          : [],

        messages:Array.isArray(data.messages)
          ? data.messages
          : [],

        blog:Array.isArray(data.blog)
          ? data.blog
          : []

      };

/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function text(value){

  return String(value || "").trim();

}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent =
    message;

  el.classList.add("show");

  setTimeout(
    () => el.classList.remove("show"),
    2200
  );

}


function formatDate(value){

  if(!value){
    return "—";
  }

  const date =
    new Date(value);

  if(Number.isNaN(date.getTime())){
    return "—";
  }

  return date.toLocaleDateString(
    "en-GB",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}

/* =========================================================
   DELETE APPLICANT
========================================================= */

function deleteApplicant(id){

  const applicant =
    db.users.find(
      item => item.id === id
    );

  if(!applicant){
    return;
  }


  const name =
    applicant.name ||
    applicant.personal?.name ||
    "this applicant";


  if(
    !confirm(
      `Delete application from ${name}?`
    )
  ){

    return;

  }


  db.users =
    db.users.filter(
      item => item.id !== id
    );


  saveDB();

  refreshAll();

  toast(
    "Application deleted."
  );

}

      closeModal(
        close.dataset.close
      );

    }

  }
);


document
  .querySelectorAll(".modal")
  .forEach(modal => {

    modal.addEventListener(
      "click",
      function(event){

        if(event.target === modal){

          modal.classList.remove(
            "open"
          );

        }

      }
    );

  });


/* =========================================================
   SIMPLE CRUD TABLES
========================================================= */

function renderSimpleTable(
  type,
  elementId,
  label
){

  const box =
    document.getElementById(
      elementId
    );


  const items =
    db[type] || [];


  if(!items.length){

    box.innerHTML = `

      <div class="empty">
        No ${esc(label.toLowerCase())} found.
      </div>

    `;

    return;

  }


  box.innerHTML = `

    <table>

      <thead>

        <tr>

          <th>Name / Title</th>
          <th>Created</th>
          <th>Actions</th>

        </tr>

      </thead>

      <tbody>

        ${items.map((item,index) => `

          <tr>

            <td>
              <strong>
                ${esc(
                  item.title ||
                  item.name ||
                  "Untitled"
                )}
              </strong>
            </td>

            <td>
              ${formatDate(
                item.created ||
                item.updated
              )}
            </td>

            <td>

              <button
                class="btn sm del"
                onclick="deleteSimpleItem('${type}',${index})"
              >
                Delete
              </button>

            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>

  `;

}


function addSimpleItem(type){

  const label = {

    jobs:"Job title",
    services:"Service name",
    employees:"Employee name",
    businesses:"Business name",
    blog:"Post title"

  }[type] || "Name";


  const value =
    prompt(
      `Enter ${label}:`
    );


  if(!value){
    return;
  }


  db[type].unshift({

    id:
      Date.now().toString(),

    name:
      value.trim(),

    title:
      value.trim(),

    created:
      new Date().toISOString()

  });


  saveDB();

  refreshAll();

  toast(
    `${label} added.`
  );

}


function deleteSimpleItem(
  type,
  index
){

  if(
    !confirm(
      "Delete this item?"
    )
  ){

    return;

  }


  db[type].splice(
    index,
    1
  );

  saveDB();

  refreshAll();

}

/* =========================================================
   BACKUP / RESTORE
========================================================= */

document.addEventListener(
  "keydown",
  function(event){

    /*
      Ctrl + Shift + E
      Export admin database
    */

    if(
      event.ctrlKey &&
      event.shiftKey &&
      event.key.toLowerCase() === "e"
    ){

      event.preventDefault();

      exportDB();

    }

  }
);


function exportDB(){

  const data =
    JSON.stringify(
      db,
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type:"application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement("a");

  a.href =
    url;

  a.download =
    `digiserbd-admin-backup-${Date.now()}.json`;

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   GLOBAL EXPORT
========================================================= */

window.exportDB =
  exportDB;

window.refreshApplicants =
  refreshApplicants;

window.addSimpleItem =
  addSimpleItem;

window.deleteSimpleItem =
  deleteSimpleItem;

</script>
