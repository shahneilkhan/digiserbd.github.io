<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>DigiSER BD Admin</title>
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15251f; --muted:#5f716a; --line:#dbe3df; --bg:#f3f6f4; --card:#ffffff;
  --brand:#0087c4; --brand-d:#00679a; --accent:#e8a317; --danger:#c0392b; --ok:#1e8e5a;
  --side:#0b2233; --side-t:#b7c9d6;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,.num{font-family:'Space Grotesk','Hind Siliguri',sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.app[hidden]{display:none}
.side{background:var(--side);color:var(--side-t);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:18px;padding:4px 8px 22px;font-family:'Space Grotesk',sans-serif}
.logo img{width:36px;height:36px;border-radius:8px;background:#fff}
.login .brand{display:flex;justify-content:center;margin-bottom:10px}
.login .brand img{width:64px;height:64px;border-radius:12px}
.nav button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;color:inherit;border-radius:8px;text-align:left;margin-bottom:2px}
.nav button:hover{background:#163349;color:#fff}
.nav button.on{background:var(--brand);color:#fff}
.nav .cnt{margin-left:auto;font-size:12px;background:#ffffff1f;border-radius:99px;padding:0 8px}
.side small{display:block;margin:20px 8px 0;font-size:12px;opacity:.7}

.main{padding:26px 30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:24px}
.menu-btn{display:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--brand)}
.stat .num{font-size:34px;font-weight:700;color:var(--brand);line-height:1.1}
.stat span{color:var(--muted)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line);align-items:center}
.bar input[type=search]{flex:1;min-width:180px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;color:var(--ink)}
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.del{color:var(--danger)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600;background:#f8faf9}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;background:#dcf0fa;color:var(--brand-d)}
.pill.off{background:#f1e4e2;color:var(--danger)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:20}
.modal.open{display:grid}
.box{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:22px}
.box h2{font-size:20px;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.note{background:#fff7e0;border:1px solid #f0d98a;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:14px}

.login{position:fixed;inset:0;background:var(--side);display:none;place-items:center;padding:16px;z-index:50}
.login.show{display:grid}
.login form{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:360px}
.login h2{font-size:22px;margin-bottom:4px}
.login p{color:var(--muted);margin-bottom:16px;font-size:14px}
.login .err{color:var(--danger);font-size:13px;min-height:20px;margin-top:6px}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;width:250px;z-index:15;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:block}
  .main{padding:18px 14px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm" autocomplete="off">
    <div class="brand"><img src="../logo.png" alt="DigiSER BD logo"></div>
    <h2 style="text-align:center">DigiSER Admin</h2>
    <p style="text-align:center">Admin password দিয়ে ঢুকুন।</p>
    <div class="field"><label for="pw">Password</label><input type="password" id="pw" autocomplete="off"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn pri" type="submit" style="width:100%;margin-top:6px">Login</button>
  </form>
</div>
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="logo"><img src="../logo.png" alt="DigiSER BD logo"> DigiSER Admin</div>
    <nav class="nav" id="nav"></nav>
    <small>ডেটা এখন এই ব্রাউজারে সেভ হচ্ছে। Firebase যুক্ত করলে সবার জন্য লাইভ হবে।</small>
  </aside>
  <main class="main">
    <div class="top">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰ Menu</button>
        <h1 id="title">Dashboard</h1>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" id="exportBtn">Export backup</button>
        <button class="btn" id="importBtn">Import backup</button>
        <input type="file" id="importFile" accept="application/json" hidden>
        <button class="btn" id="logoutBtn">Logout</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 1) DATA LAYER ============
   এখন localStorage ব্যবহার করছে। পরে Firebase যুক্ত করার সময়
   শুধু এই store অবজেক্টের ভেতরের কোড বদলাতে হবে, বাকি পুরো panel একই থাকবে। */
const store = {
  key: 'digiserbd_admin_v1',
  load() {
    try { const d = JSON.parse(localStorage.getItem(this.key)); if (d) return d; } catch (e) {}
    return null;
  },
  save(data) {
    try { localStorage.setItem(this.key, JSON.stringify(data)); } catch (e) { toast('Save failed: browser storage blocked'); }
  }
};

/* ============ 2) SECTIONS CONFIG ============ */
const SECTIONS = {
  jobs: {
    label: 'Jobs', single: 'Job',
    fields: [
      {k:'title', l:'Job title', req:1},
      {k:'company', l:'Company', req:1},
      {k:'type', l:'Type', opts:['Full Time','Part Time','Contract','Internship']},
      {k:'location', l:'Location', def:'Dhaka, Bangladesh'},
      {k:'salary', l:'Salary (e.g. ৳15,000 – ৳25,000)'},
      {k:'status', l:'Status', opts:['Active','Hidden']}
    ],
    cols: ['title','company','type','salary','status']
  },
  services: {
    label: 'Services', single: 'Service',
    fields: [
      {k:'icon', l:'Icon (emoji)', def:'🛠'},
      {k:'title', l:'Service name', req:1},
      {k:'desc', l:'Short description', area:1},
      {k:'price', l:'Price text (e.g. From ৳500 / Contact Us)'},
      {k:'status', l:'Status', opts:['Active','Hidden']}
    ],
    cols: ['icon','title','price','status']
  },
  employees: {
    label: 'Employees', single: 'Employee',
    fields: [
      {k:'name', l:'Name', req:1},
      {k:'role', l:'Role / Skill', req:1},
      {k:'rating', l:'Rating (0-5)', def:'4.5'},
      {k:'reviews', l:'Review count', def:'0'},
      {k:'phone', l:'Phone'},
      {k:'status', l:'Status', opts:['Available','Busy','Hidden']}
    ],
    cols: ['name','role','rating','phone','status']
  },
  businesses: {
    label: 'Businesses', single: 'Business',
    fields: [
      {k:'name', l:'Business name', req:1},
      {k:'category', l:'Category'},
      {k:'location', l:'Location', def:'Dhaka, Bangladesh'},
      {k:'phone', l:'Phone'},
      {k:'status', l:'Status', opts:['Active','Pending','Hidden']}
    ],
    cols: ['name','category','location','phone','status']
  },
  messages: {
    label: 'Messages', single: 'Message',
    fields: [
      {k:'name', l:'Name', req:1},
      {k:'contact', l:'Phone / Email'},
      {k:'message', l:'Message', area:1},
      {k:'status', l:'Status', opts:['New','Done']}
    ],
    cols: ['name','contact','message','status']
  }
};

const SEED = {
  jobs: [
    {title:'Graphic Designer',company:'Creative Studio BD',type:'Full Time',location:'Dhaka, Bangladesh',salary:'৳15,000 – ৳25,000',status:'Active'},
    {title:'Social Media Manager',company:'Digital Growth Ltd.',type:'Part Time',location:'Dhaka, Bangladesh',salary:'৳10,000 – ৳18,000',status:'Active'},
    {title:'Web Developer',company:'Tech Solution BD',type:'Full Time',location:'Dhaka, Bangladesh',salary:'৳20,000 – ৳40,000',status:'Active'},
    {title:'Office Assistant',company:'Sunrise Trading',type:'Contract',location:'Dhaka, Bangladesh',salary:'৳8,000 – ৳12,000',status:'Active'}
  ],
  services: [
    {icon:'🎨',title:'Graphic Design',desc:'Logo, Banner, Social Media Post, Print Design and more.',price:'From ৳500',status:'Active'},
    {icon:'📱',title:'Social Media Management',desc:'Facebook, Instagram, YouTube, TikTok marketing and management.',price:'From ৳1,000',status:'Active'},
    {icon:'💻',title:'Website Maintenance',desc:'Website update, backup, security and content support.',price:'From ৳1,000',status:'Active'},
    {icon:'👨‍💼',title:'Employee Supplier',desc:'Skilled and unskilled manpower for your local business.',price:'Contact Us',status:'Active'},
    {icon:'🏠',title:'Land Supported Service',desc:'Land purchase, rent, document support and consultation.',price:'Contact Us',status:'Active'},
    {icon:'📈',title:'Digital Marketing',desc:'SEO, advertising, content and business lead generation.',price:'From ৳1,000',status:'Active'},
    {icon:'📝',title:'Data Entry & Admin Support',desc:'Data entry, Excel, PDF, virtual assistant support.',price:'From ৳500',status:'Active'},
    {icon:'🔧',title:'Other Local Services',desc:'Printing, delivery, event support and other local services.',price:'From ৳300',status:'Active'}
  ],
  employees: [
    {name:'Md. Rahman',role:'Graphic Designer',rating:'4.8',reviews:'24',phone:'',status:'Available'},
    {name:'Ayesha Akter',role:'Social Media Manager',rating:'4.7',reviews:'18',phone:'',status:'Available'},
    {name:'Tariq Hasan',role:'Web Developer',rating:'4.9',reviews:'32',phone:'',status:'Available'},
    {name:'Nusrat Jahan',role:'Content Writer',rating:'4.6',reviews:'21',phone:'',status:'Available'},
    {name:'Rasel Ahmed',role:'Data Entry Operator',rating:'4.5',reviews:'16',phone:'',status:'Available'},
    {name:'Shamim Hossain',role:'Video Editor',rating:'4.7',reviews:'14',phone:'',status:'Available'}
  ],
  businesses: [],
  messages: []
};

/* ============ 3) STATE ============ */
let db = store.load();
if (!db) {
  db = {};
  for (const s in SEED) db[s] = SEED[s].map((r, i) => ({id: s[0] + Date.now() + i, ...r}));
  store.save(db);
}
let current = 'dashboard';
let query = '';

/* ============ 4) HELPERS ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function persist(){ store.save(db); }

/* ============ 5) RENDER ============ */
function renderNav(){
  let h = `<button data-go="dashboard" class="${current==='dashboard'?'on':''}">📊 Dashboard</button>`;
  const icons = {jobs:'💼',services:'🛠',employees:'👥',businesses:'🏪',messages:'💬'};
  for (const s in SECTIONS){
    h += `<button data-go="${s}" class="${current===s?'on':''}">${icons[s]} ${SECTIONS[s].label}<span class="cnt">${db[s].length}</span></button>`;
  }
  $('nav').innerHTML = h;
}

function render(){
  renderNav();
  $('title').textContent = current==='dashboard' ? 'Dashboard' : SECTIONS[current].label;
  $('view').innerHTML = current==='dashboard' ? dashboard() : listView(current);
  $('side').classList.remove('open');
}

function dashboard(){
  let h = `<div class="note"><b>শুরু করার ধাপ:</b> বাম পাশের মেনু থেকে Jobs, Services, Employees বা Businesses খুলে Add / Edit / Delete করুন। এখনকার ডেটা শুধু আপনার ব্রাউজারে থাকছে, তাই মাঝে মাঝে <b>Export backup</b> নিয়ে রাখুন।</div><div class="stats">`;
  for (const s in SECTIONS){
    h += `<button class="stat" data-go="${s}"><div class="num">${db[s].length}</div><span>${SECTIONS[s].label}</span></button>`;
  }
  const newMsg = db.messages.filter(m=>m.status==='New').length;
  h += `</div><div class="panel"><div class="bar"><b>নতুন মেসেজ: ${newMsg}</b></div><div class="empty">${newMsg? 'Messages মেনুতে গিয়ে দেখুন।' : 'কোনো নতুন মেসেজ নেই।'}</div></div>`;
  return h;
}

function listView(s){
  const cfg = SECTIONS[s];
  const q = query.toLowerCase();
  const rows = db[s].filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  let h = `<div class="panel"><div class="bar">
    <input type="search" id="search" placeholder="Search ${cfg.label.toLowerCase()}..." value="${esc(query)}" aria-label="Search">
    <button class="btn pri" data-add="${s}">+ Add ${cfg.single}</button></div>`;
  if (!rows.length){
    h += `<div class="empty">${db[s].length? 'কিছু পাওয়া যায়নি।' : 'এখনো কিছু নেই। উপরের বাটনে চাপ দিয়ে প্রথমটি যোগ করুন।'}</div></div>`;
    return h;
  }
  h += `<div class="tablewrap"><table><thead><tr>`;
  cfg.cols.forEach(c => { const f = cfg.fields.find(x=>x.k===c); h += `<th>${esc(f.l.replace(/ \(.*\)/,''))}</th>`; });
  h += `<th></th></tr></thead><tbody>`;
  rows.forEach(r => {
    h += `<tr>`;
    cfg.cols.forEach(c => {
      if (c==='status'){ const off = ['Hidden','Busy'].includes(r[c]); h += `<td><span class="pill ${off?'off':''}">${esc(r[c])}</span></td>`; }
      else h += `<td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${esc(r[c])}</td>`;
    });
    h += `<td style="text-align:right"><button class="btn sm" data-edit="${r.id}">Edit</button> <button class="btn sm del" data-del="${r.id}">Delete</button></td></tr>`;
  });
  return h + `</tbody></table></div></div>`;
}

/* ============ 6) FORM MODAL ============ */
function openForm(s, id){
  const cfg = SECTIONS[s];
  const rec = id ? db[s].find(r=>r.id===id) : {};
  let h = `<h2>${id?'Edit':'Add'} ${cfg.single}</h2><div>`;
  cfg.fields.forEach(f => {
    const v = rec[f.k] ?? f.def ?? (f.opts ? f.opts[0] : '');
    h += `<div class="field"><label for="f_${f.k}">${esc(f.l)}${f.req?' *':''}</label>`;
    if (f.opts) h += `<select id="f_${f.k}">${f.opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.area) h += `<textarea id="f_${f.k}" rows="3">${esc(v)}</textarea>`;
    else h += `<input id="f_${f.k}" value="${esc(v)}">`;
    h += `</div>`;
  });
  h += `</div><div class="acts"><button class="btn" data-close>Cancel</button><button class="btn pri" id="saveBtn">Save</button></div>`;
  $('box').innerHTML = h;
  $('modal').classList.add('open');
  $('saveBtn').onclick = () => {
    const data = {};
    for (const f of cfg.fields){
      data[f.k] = $('f_'+f.k).value.trim();
      if (f.req && !data[f.k]){ toast(f.l.replace(/ \(.*\)/,'') + ' দিন'); $('f_'+f.k).focus(); return; }
    }
    if (id) Object.assign(rec, data);
    else db[s].unshift({id: s[0] + Date.now(), ...data});
    persist(); closeModal(); render(); toast('Saved');
  };
  setTimeout(()=>$('box').querySelector('input,select,textarea')?.focus(), 30);
}
function closeModal(){ $('modal').classList.remove('open'); }

/* ============ 7) EVENTS ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-add],[data-edit],[data-del],[data-close]');
  if (!t) { if (e.target === $('modal')) closeModal(); return; }
  if (t.dataset.go){ current = t.dataset.go; query=''; render(); }
  else if (t.dataset.add) openForm(t.dataset.add);
  else if (t.dataset.edit) openForm(current, t.dataset.edit);
  else if (t.dataset.del){
    if (confirm('এটি মুছে ফেলবেন? আর ফেরত আনা যাবে না।')){
      db[current] = db[current].filter(r=>r.id!==t.dataset.del);
      persist(); render(); toast('Deleted');
    }
  }
  else if (t.hasAttribute('data-close')) closeModal();
});
document.addEventListener('input', e => {
  if (e.target.id==='search'){
    query = e.target.value; const pos = e.target.selectionStart;
    $('view').innerHTML = listView(current);
    const el = $('search'); el.focus(); el.setSelectionRange(pos,pos);
  }
});
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });
$('menuBtn').onclick = () => $('side').classList.toggle('open');

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'digiserbd-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      for (const s in SECTIONS) if (!Array.isArray(d[s])) throw 0;
      if (!confirm('বর্তমান ডেটা বদলে backup-এর ডেটা বসানো হবে। চালিয়ে যাবেন?')) return;
      db = d; persist(); render(); toast('Imported');
    } catch { toast('ভুল backup ফাইল'); }
  };
  r.readAsText(file); e.target.value = '';
};

/* ============ 8) DEMO LOGIN ============
   সাময়িক demo password. এটা আসল সুরক্ষা নয়, কারণ কোড সবাই দেখতে পারে।
   Firebase Login যোগ করলে এটা বদলে আসল লগইন হবে। */
const DEMO_PASSWORD = 'digiser2026';
function showApp(){
  $('login').classList.remove('show');
  $('app').hidden = false;
  render();
}
function showLogin(){
  $('app').hidden = true;
  $('login').classList.add('show');
  $('pw').value = ''; $('loginErr').textContent = '';
  setTimeout(()=>$('pw').focus(), 30);
}
$('loginForm').onsubmit = e => {
  e.preventDefault();
  if ($('pw').value === DEMO_PASSWORD){
    try { sessionStorage.setItem('digiser_admin_ok','1'); } catch(_) {}
    showApp();
  } else {
    $('loginErr').textContent = 'Password ভুল হয়েছে। আবার চেষ্টা করুন।';
    $('pw').select();
  }
};
$('logoutBtn').onclick = () => {
  try { sessionStorage.removeItem('digiser_admin_ok'); } catch(_) {}
  showLogin();
};
let authed = false;
try { authed = sessionStorage.getItem('digiser_admin_ok') === '1'; } catch(_) {}
authed ? showApp() : showLogin();
</script>
</body>
