<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiSER BD · Admin Dashboard</title>

<meta name="description" content="DigiSER BD Admin Dashboard">
<meta name="theme-color" content="#0087c4">

<!-- FAVICON -->
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/favicon.svg">

<!-- FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ROOT
========================================================= */

:root{
  --primary:#0087c4;
  --primary-dark:#006b9d;

  --dark:#10202b;
  --dark-2:#162d3a;

  --text:#17202a;
  --muted:#687580;

  --line:#e1e7eb;
  --bg:#f4f7f9;
  --white:#ffffff;

  --success:#14834a;
  --danger:#c0392b;

  --soft:#eef8fc;
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Hind Siliguri",sans-serif;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================================================
   LOGIN
========================================================= */

.login-screen{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;

  background:
    radial-gradient(
      circle at 85% 10%,
      rgba(0,135,196,.16),
      transparent 35%
    ),
    var(--bg);
}

.login-box{
  width:100%;
  max-width:420px;

  padding:36px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:22px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.08);
}

.login-logo{
  text-align:center;
}

.login-logo img{
  width:64px;
  height:64px;

  object-fit:contain;

  border-radius:12px;
}

.login-box h1{
  margin:15px 0 5px;

  text-align:center;

  font-family:"Space Grotesk",sans-serif;
}

.login-box p{
  margin:0 0 25px;

  text-align:center;

  color:var(--muted);

  font-size:13px;
}

.login-input{
  width:100%;

  padding:13px 14px;

  border:1px solid var(--line);

  border-radius:10px;

  outline:none;
}

.login-input:focus{
  border-color:var(--primary);

  box-shadow:
    0 0 0 3px rgba(0,135,196,.1);
}

.login-btn{
  width:100%;

  margin-top:12px;

  padding:13px;

  border:0;

  border-radius:10px;

  background:var(--primary);

  color:#fff;

  font-weight:700;
}

.login-btn:hover{
  background:var(--primary-dark);
}

.login-error{
  min-height:18px;

  margin-top:10px;

  text-align:center;

  color:var(--danger);

  font-size:12px;
}


/* =========================================================
   APPLICATION
========================================================= */

.app{
  display:none;

  min-height:100vh;
}

.app.show{
  display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
  position:fixed;

  top:0;
  left:0;
  bottom:0;

  width:245px;

  z-index:50;

  padding:22px 15px;

  background:var(--dark);

  color:#fff;
}

.admin-brand{
  display:flex;

  align-items:center;

  gap:10px;

  padding:4px 8px 23px;

  border-bottom:
    1px solid rgba(255,255,255,.1);
}

.admin-brand img{
  width:40px;
  height:40px;

  object-fit:contain;

  border-radius:10px;
}

.admin-brand strong{
  display:block;

  font-family:"Space Grotesk",sans-serif;
}

.admin-brand small{
  display:block;

  margin-top:2px;

  color:#91aab7;

  font-size:9px;

  letter-spacing:.08em;
}

.nav{
  margin-top:20px;
}

.nav-btn{
  width:100%;

  display:flex;

  align-items:center;

  gap:10px;

  padding:11px 12px;

  margin-bottom:3px;

  border:0;

  border-radius:9px;

  background:transparent;

  color:#b8c6cd;

  text-align:left;
}

.nav-btn:hover,
.nav-btn.active{
  background:
    rgba(255,255,255,.09);

  color:#fff;
}

.logout-btn{
  position:absolute;

  left:15px;
  right:15px;
  bottom:20px;

  padding:10px;

  border:
    1px solid rgba(255,255,255,.15);

  border-radius:9px;

  background:transparent;

  color:#fff;
}


/* =========================================================
   MAIN
========================================================= */

.main{
  width:calc(100% - 245px);

  margin-left:245px;

  min-height:100vh;
}

.topbar{
  min-height:72px;

  padding:0 25px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:#fff;

  border-bottom:1px solid var(--line);
}

.topbar h1{
  margin:0;

  font-family:"Space Grotesk",sans-serif;

  font-size:21px;
}

.topbar p{
  margin:3px 0 0;

  color:var(--muted);

  font-size:12px;
}

.content{
  padding:25px;
}


/* =========================================================
   STATS
========================================================= */

.stats{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:15px;
}

.stat{
  padding:19px;

  background:#fff;

  border:1px solid var(--line);

  border-radius:15px;
}

.stat small{
  color:var(--muted);
}

.stat strong{
  display:block;

  margin-top:5px;

  font-family:"Space Grotesk",sans-serif;

  font-size:29px;
}


/* =========================================================
   PANEL
========================================================= */

.panel{
  margin-top:20px;

  overflow:hidden;

  background:#fff;

  border:1px solid var(--line);

  border-radius:16px;
}

.panel-head{
  padding:18px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:15px;

  border-bottom:1px solid var(--line);
}

.panel-head h2{
  margin:0;

  font-family:"Space Grotesk",sans-serif;

  font-size:17px;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;

  border-collapse:collapse;
}

th,
td{
  padding:13px 15px;

  border-bottom:1px solid var(--line);

  text-align:left;

  white-space:nowrap;

  font-size:12px;
}

th{
  background:#f8fafb;

  color:var(--muted);
}

.badge{
  display:inline-block;

  padding:5px 9px;

  border-radius:20px;

  background:var(--soft);

  color:var(--primary-dark);

  font-size:10px;

  font-weight:700;
}

.actions{
  display:flex;

  gap:5px;
}

.btn{
  padding:7px 10px;

  border:1px solid var(--line);

  border-radius:7px;

  background:#fff;

  font-size:11px;

  font-weight:700;
}

.btn.primary{
  background:var(--primary);

  border-color:var(--primary);

  color:#fff;
}

.btn.primary:hover{
  background:var(--primary-dark);
}

.btn.danger{
  color:var(--danger);
}

.empty{
  padding:45px;

  text-align:center;

  color:var(--muted);
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  z-index:100;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:
    rgba(8,18,23,.68);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;

  max-width:980px;

  max-height:92vh;

  overflow:auto;

  background:#fff;

  border-radius:18px;
}

.modal-head{
  position:sticky;

  top:0;

  z-index:10;

  padding:17px 20px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:#fff;

  border-bottom:1px solid var(--line);
}

.modal-head h2{
  margin:0;

  font-family:"Space Grotesk",sans-serif;

  font-size:17px;
}

.close{
  width:32px;
  height:32px;

  border:0;

  border-radius:50%;

  background:#f0f3f5;

  font-size:18px;
}

.modal-body{
  padding:20px;
}


/* =========================================================
   APPLICANT DETAILS
========================================================= */

.detail-grid{
  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  gap:14px;
}

.detail{
  padding:13px;

  background:#f7f9fa;

  border-radius:10px;
}

.detail.full{
  grid-column:1/-1;
}

.detail small{
  display:block;

  margin-bottom:4px;

  color:var(--muted);

  font-size:11px;
}

.detail p{
  margin:0;

  white-space:pre-line;

  font-size:13px;
}

.detail select{
  width:100%;

  padding:9px;

  border:1px solid var(--line);

  border-radius:8px;

  background:#fff;
}


/* =========================================================
   PREMIUM CV
========================================================= */

.cv-actions{
  position:sticky;

  top:0;

  z-index:20;

  padding:13px 16px;

  display:flex;

  justify-content:flex-end;

  gap:8px;

  background:#fff;

  border-bottom:1px solid var(--line);
}

.cv-view{
  padding:20px;

  background:#e8edf0;
}

.cv-paper{
  max-width:850px;

  min-height:1100px;

  margin:auto;

  overflow:hidden;

  background:#fff;

  box-shadow:
    0 12px 45px rgba(0,0,0,.12);
}


/* ---------- CV HEADER ---------- */

.cv-top{
  padding:38px;

  display:flex;

  align-items:center;

  gap:26px;

  background:
    linear-gradient(
      135deg,
      #10202b 0%,
      #006f9f 100%
    );

  color:#fff;
}

.cv-photo{
  width:125px;
  height:125px;

  flex:none;

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  border:
    3px solid rgba(255,255,255,.45);

  border-radius:20px;

  background:
    rgba(255,255,255,.12);

  color:#dceaf0;

  font-family:"Space Grotesk",sans-serif;

  font-size:11px;
}

.cv-photo img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.cv-name{
  font-family:"Space Grotesk",sans-serif;

  font-size:34px;

  font-weight:700;

  line-height:1.1;
}

.cv-role{
  margin-top:7px;

  color:#aee6fa;

  font-size:14px;

  font-weight:700;
}

.cv-contact{
  margin-top:10px;

  color:#dceaf0;

  font-size:12px;

  line-height:1.7;
}


/* ---------- CV BODY ---------- */

.cv-body{
  display:grid;

  grid-template-columns:220px 1fr;
}

.cv-side{
  padding:30px 22px;

  background:#f3f8fa;

  border-right:1px solid var(--line);
}

.cv-main{
  padding:30px;
}


/* ---------- CV SECTION ---------- */

.cv-section{
  margin-bottom:26px;
}

.cv-section:last-child{
  margin-bottom:0;
}

.cv-section h3{
  margin:0 0 9px;

  color:var(--primary-dark);

  font-family:"Space Grotesk",sans-serif;

  font-size:11px;

  font-weight:700;

  letter-spacing:.09em;

  text-transform:uppercase;
}

.cv-section p{
  margin:0;

  color:#4c5961;

  font-size:12px;

  line-height:1.8;

  white-space:pre-line;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1000px){

  .stats{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}

@media(max-width:750px){

  .sidebar{
    width:66px;

    padding:15px 8px;
  }

  .admin-brand{
    justify-content:center;
  }

  .admin-brand div{
    display:none;
  }

  .nav-btn{
    justify-content:center;

    font-size:0;
  }

  .nav-btn:first-letter{
    font-size:16px;
  }

  .logout-btn{
    font-size:0;
  }

  .logout-btn:first-letter{
    font-size:16px;
  }

  .main{
    width:calc(100% - 66px);

    margin-left:66px;
  }

  .content{
    padding:15px;
  }

  .topbar{
    padding:0 15px;
  }

  .detail-grid{
    grid-template-columns:1fr;
  }

  .detail.full{
    grid-column:auto;
  }

  .cv-body{
    grid-template-columns:1fr;
  }

  .cv-side{
    border-right:0;

    border-bottom:1px solid var(--line);
  }

}

@media(max-width:520px){

  .stats{
    grid-template-columns:1fr;
  }

  .cv-top{
    padding:25px;

    gap:17px;
  }

  .cv-photo{
    width:90px;
    height:90px;
  }

  .cv-name{
    font-size:25px;
  }

  .cv-main{
    padding:23px;
  }

  .cv-side{
    padding:23px;
  }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

  body *{
    visibility:hidden!important;
  }

  #cvModal,
  #cvModal *{
    visibility:visible!important;
  }

  #cvModal{
    position:absolute;

    inset:0;

    padding:0;

    background:#fff;
  }

  .modal-box{
    max-height:none;

    border-radius:0;
  }

  .cv-actions,
  .modal-head{
    display:none!important;
  }

  .cv-view{
    padding:0;

    background:#fff;
  }

  .cv-paper{
    max-width:none;

    min-height:0;

    box-shadow:none;
  }

}

</style>
</head>


<body>

<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const STORAGE_KEY =
  "digiserbd_admin_v1";

const ADMIN_PASSWORD =
  "digiser2026";


/* =========================================================
   ELEMENTS
========================================================= */

const loginScreen =
  document.getElementById(
    "loginScreen"
  );

const app =
  document.getElementById(
    "app"
  );

const password =
  document.getElementById(
    "password"
  );

const loginBtn =
  document.getElementById(
    "loginBtn"
  );

const loginError =
  document.getElementById(
    "loginError"
  );

const table =
  document.getElementById(
    "applicantTable"
  );

const detailModal =
  document.getElementById(
    "detailModal"
  );

const cvModal =
  document.getElementById(
    "cvModal"
  );

const detailBody =
  document.getElementById(
    "detailBody"
  );

const cvPaper =
  document.getElementById(
    "cvPaper"
  );


/* =========================================================
   DATABASE
========================================================= */

function getDB(){

  try{

    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if(!raw){

      return {

        users:[],

        jobs:[],

        services:[],

        employees:[],

        businesses:[],

        messages:[],

        blog:[]

      };

    }


    const db =
      JSON.parse(raw);


    db.users ||= [];

    db.jobs ||= [];

    db.services ||= [];

    db.employees ||= [];

    db.businesses ||= [];

    db.messages ||= [];

    db.blog ||= [];


    return db;


  }catch(error){

    return {

      users:[],

      jobs:[],

      services:[],

      employees:[],

      businesses:[],

      messages:[],

      blog:[]

    };

  }

}


function saveDB(db){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(db)
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value){

  return String(value || "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

  if(
    password.value ===
    ADMIN_PASSWORD
  ){

    sessionStorage.setItem(
      "digiserbd_admin_login",
      "1"
    );


    loginScreen.style.display =
      "none";


    app.classList.add(
      "show"
    );


    render();

  }else{

    loginError.textContent =
      "Incorrect admin password.";

  }

}


loginBtn.addEventListener(
  "click",
  login
);


password.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      login();

    }

  }
);


/* =========================================================
   LOGOUT
========================================================= */

document
  .getElementById(
    "logoutBtn"
  )
  .addEventListener(
    "click",

/* =========================================================
   RENDER DASHBOARD
========================================================= */

function render(){

  const db =
    getDB();

  const users =
    db.users || [];


  document.getElementById(
    "totalApplicants"
  ).textContent =
    users.length;


  document.getElementById(
    "newApplicants"
  ).textContent =
    users.filter(
      user =>
        user.status === "new"
    ).length;


  document.getElementById(
    "businessCount"
  ).textContent =
    (
      db.businesses || []
    ).length;


  document.getElementById(
    "messageCount"
  ).textContent =
    (
      db.messages || []
    ).length;


  if(!users.length){

    table.innerHTML = `

      <tr>

        <td colspan="6">

          <div class="empty">

            No applicants yet.

          </div>

        </td>

      </tr>

    `;

    return;

  }


  table.innerHTML =

    users

      .slice()

      .reverse()

      .map(

        user => {

          const name =
            user.personal?.name ||
            user.name ||
            "Unknown";


          const phone =
            user.personal?.mobile ||
            "—";


          const role =
            user.wanted?.role ||
            "—";


          const status =
            user.status ||
            "new";


          const date =
            user.created

              ? new Date(
                  user.created
                ).toLocaleDateString()

              : "—";


          return `

            <tr>

              <td>

                <strong>
                  ${esc(name)}
                </strong>

              </td>


              <td>
                ${esc(phone)}
              </td>


              <td>
                ${esc(role)}
              </td>


              <td>

                <span class="badge">
                  ${esc(status)}
                </span>

              </td>


              <td>
                ${date}
              </td>


              <td>

                <div class="actions">

                  <button
                    class="btn primary"
                    onclick="viewApplicant('${esc(user.id)}')"
                  >
                    View
                  </button>


                  <button
                    class="btn"
                    onclick="viewCV('${esc(user.id)}')"
                  >
                    CV
                  </button>


                  <button
                    class="btn danger"
                    onclick="deleteApplicant('${esc(user.id)}')"
                  >
                    Delete
                  </button>

                </div>

              </td>

            </tr>

          `;

        }

      )

      .join("");

}

/* =========================================================
   SAVE STATUS
========================================================= */

window.saveStatus =
function(id){

  const db =
    getDB();


  const user =
    db.users.find(
      item =>
        item.id === id
    );


  if(!user){
    return;
  }


  const select =
    document.getElementById(
      "statusSelect"
    );


  user.status =
    select.value;


  user.updated =
    new Date().toISOString();


  saveDB(db);


  detailModal.classList.remove(
    "show"
  );


  render();

};


/* =========================================================
   DELETE APPLICANT
========================================================= */

window.deleteApplicant =
function(id){

  const confirmDelete =
    confirm(
      "Delete this applicant permanently?"
    );


  if(!confirmDelete){
    return;
  }


  const db =
    getDB();


  db.users =
    db.users.filter(
      user =>
        user.id !== id
    );


  saveDB(db);


  render();

};


/* =========================================================
   PREMIUM CV
   SAME STRUCTURE AS REGISTER V2
========================================================= */

function buildPremiumCV(user){

  const personal =
    user.personal || {};


  const education =
    user.education || {};


  const experience =
    user.experience || {};


  const skills =
    user.skills || {};


  const language =
    user.language || {};


  const wanted =
    user.wanted || {};


  const reference =
    user.reference || {};


  /*
    PHOTO SUPPORT

    New Register:
      personal.photo

    Older possible versions:
      personal.profilePhoto
      photo
  */

  const photo =
    personal.photo ||
    personal.profilePhoto ||
    user.photo ||
    "";


  const educationText = [

    education.ssc
      ? "SSC: " +
        education.ssc
      : "",

    education.hsc
      ? "HSC: " +
        education.hsc
      : "",

    education.graduate
      ? education.graduate
      : "",

    education.other
      ? education.other
      : ""

  ]

  .filter(Boolean)

  .join("\n");


  const experienceText = [

    experience.experience
      ? experience.experience
      : "",

    experience.duty
      ? "Duties: " +
        experience.duty
      : "",

    experience.previousSalary
      ? "Previous Salary: " +
        experience.previousSalary
      : ""

  ]

  .filter(Boolean)

  .join("\n");


  const preferenceText = [

    wanted.type
      ? "Type: " +
        wanted.type
      : "",

    wanted.location
      ? "Location: " +
        wanted.location
      : "",

    wanted.salary
      ? "Expected Salary: " +
        wanted.salary
      : ""

  ]

  .filter(Boolean)

  .join("\n");


  const referenceText = [

    reference.name,

    reference.contact,

    reference.relation

  ]

  .filter(Boolean)

  .join(" · ");


  return `

    <!-- CV HEADER -->

    <div class="cv-top">


      <div class="cv-photo">

        ${
          photo

          ?

          `
          <img
            src="${photo}"
            alt="Profile Photo"
          >
          `

          :

          `
          PHOTO
          `
        }

      </div>


      <div>

        <div class="cv-name">

          ${esc(
            personal.name ||
            user.name ||
            "Applicant"
          )}

        </div>


        <div class="cv-role">

          ${esc(
            wanted.role ||
            "Professional"
          )}

        </div>


        <div class="cv-contact">

          ${esc(
            personal.mobile || ""
          )}

          ${
            personal.email

            ?

            " · " +
            esc(
              personal.email
            )

            :

            ""
          }


          ${
            personal.currentAddress

            ?

            "<br>" +
            esc(
              personal.currentAddress
            )

            :

            ""
          }

        </div>

      </div>

    </div>


    <!-- CV BODY -->

    <div class="cv-body">


      <!-- LEFT SIDE -->

      <aside class="cv-side">


        ${
          skills.skills

          ?

          `

          <div class="cv-section">

            <h3>
              Skills
            </h3>

            <p>
              ${esc(
                skills.skills
              )}
            </p>

          </div>

          `

          :

          ""
        }


        ${
          language.language

          ?

          `

          <div class="cv-section">

            <h3>
              Languages
            </h3>

            <p>
              ${esc(
                language.language
              )}
            </p>

          </div>

          `

          :

          ""
        }


        ${
          preferenceText

          ?

          `

          <div class="cv-section">

            <h3>
              Preference
            </h3>

            <p>
              ${esc(
                preferenceText
              )}
            </p>

          </div>

          `

          :

          ""
        }


        ${
          referenceText

          ?

          `

          <div class="cv-section">

            <h3>
              Reference
            </h3>

            <p>
              ${esc(
                referenceText
              )}
            </p>

          </div>

          `

          :

          ""
        }


      </aside>


      <!-- RIGHT SIDE -->

      <main class="cv-main">


        ${
          personal.profile

          ?

          `

          <div class="cv-section">

            <h3>
              Profile
            </h3>

            <p>
              ${esc(
                personal.profile
              )}
            </p>

          </div>

          `

          :

          ""
        }


        ${
          experienceText

          ?

          `

          <div class="cv-section">

            <h3>
              Experience
            </h3>

            <p>
              ${esc(
                experienceText
              )}
            </p>

          </div>

          `

          :

          ""
        }


        ${
          educationText

          ?

          `

          <div class="cv-section">

            <h3>
              Education
            </h3>

            <p>
              ${esc(
                educationText
              )}
            </p>

          </div>

          `

          :

          ""
        }


        ${
          personal.permanentAddress

          ?

          `

          <div class="cv-section">

            <h3>
              Address
            </h3>

            <p>
              ${esc(
                personal.permanentAddress
              )}
            </p>

          </div>

          `

          :

          ""
        }


      </main>


    </div>

  `;

}


/* =========================================================
   VIEW CV
========================================================= */

window.viewCV =
function(id){

  const db =
    getDB();


  const user =
    db.users.find(
      item =>
        item.id === id
    );


  if(!user){
    return;
  }


  cvPaper.innerHTML =
    buildPremiumCV(
      user
    );


  cvModal.classList.add(
    "show"
  );

};

========================================================= */
