<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DigiSER Admin</title>
<link rel="icon" href="../favicon.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --blue:#0087c4;--blue2:#006d9e;--nav:#071b25;--bg:#f4f8fa;--card:#fff;
 --text:#13252e;--muted:#72838b;--border:#dce7ec;--green:#18a56b;--red:#d64545;--orange:#e99a28;
}

body{font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#login{
 min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;
 background:
 radial-gradient(circle at 15% 15%,rgba(0,135,196,.12),transparent 35%),
 radial-gradient(circle at 85% 85%,rgba(24,165,107,.08),transparent 35%),
 #f4f9fb;
}
.login-card{width:100%;max-width:420px;background:#fff;padding:36px;border-radius:24px;box-shadow:0 30px 90px rgba(0,70,100,.14)}
.login-card img{width:62px;height:62px;object-fit:contain;display:block;margin:0 auto 18px}
.login-card h1{text-align:center;font-size:27px}
.login-card p{text-align:center;color:var(--muted);font-size:12px;margin:7px 0 25px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:11px;padding:12px 13px;outline:none;background:#fbfdfe}
.field input{height:46px}
.field textarea{min-height:100px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,135,196,.1)}
.btn{border:0;min-height:44px;padding:0 17px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:700}
.btn:hover{filter:brightness(.96)}
.btn.full{width:100%;height:50px}
.btn.light{background:#fff;color:#52656e;border:1px solid var(--border)}
.error{display:none;margin-top:13px;padding:11px;border-radius:10px;color:#b22e2e;background:#fff0f0;border:1px solid #ffd4d4;font-size:12px}

/* APP */
#app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
aside{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--nav);color:#fff;padding:18px 13px;overflow-y:auto;z-index:20}
.brand{display:flex;gap:10px;align-items:center;padding:5px 8px 23px}
.brand img{width:40px;height:40px;padding:5px;background:#fff;border-radius:10px;object-fit:contain}
.brand b{font-size:14px;display:block}
.brand small{color:#78909a;font-size:10px}
.nav-title{color:#536c77;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;padding:13px 12px 5px}
nav{display:grid;gap:3px}
nav button{border:0;background:none;color:#9db1b9;text-align:left;border-radius:9px;padding:10px 12px;font-size:12px;font-weight:600}
nav button:hover,nav button.active{background:rgba(0,135,196,.2);color:#fff}
.account{position:absolute;left:13px;right:13px;bottom:14px;background:rgba(255,255,255,.05);border-radius:12px;padding:11px}
.account b{font-size:12px}
.account span{display:block;color:#78909a;font-size:10px;margin:3px 0 9px}
.account button{width:100%;border:1px solid rgba(255,255,255,.1);background:none;color:#a5b5bc;padding:8px;border-radius:8px}

/* MAIN */
main{grid-column:2;padding:28px 30px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:20px}
.page-head h2{font-size:26px;letter-spacing:-.8px}
.page-head p{color:var(--muted);font-size:12px;margin-top:4px}
.role{background:#eaf8ff;color:var(--blue);border-radius:999px;padding:7px 12px;font-size:10px;font-weight:800}

/* DASHBOARD */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}
.stat small{color:var(--muted);font-size:11px}
.stat strong{display:block;margin-top:7px;font-size:28px}

/* TOOLBAR */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.search{width:280px;height:43px;border:1px solid var(--border);border-radius:10px;padding:0 12px;outline:none}
.search:focus{border-color:var(--blue)}

/* TABLE */
.panel{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:780px}
th{background:#f7fafb;color:#819099;font-size:10px;text-align:left;padding:12px;border-bottom:1px solid var(--border)}
td{padding:12px;border-bottom:1px solid #edf2f4;font-size:12px;vertical-align:top}
tr:last-child td{border-bottom:0}
.empty{padding:45px 20px;text-align:center;color:#8b9aa2;font-size:12px}

/* ACTION */
.action{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;color:#536770;padding:6px 9px;border-radius:8px;font-size:10px;font-weight:700;margin:0 4px 3px 0;text-decoration:none}
.action.edit:hover{color:var(--blue);border-color:var(--blue)}
.action.approve{color:var(--green);border-color:#bfe8d6}
.action.approve:hover{background:#eafaf3}
.action.delete{color:var(--red)}
.action.delete:hover{background:#fff3f3;border-color:#f2bcbc}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800}
.badge.green{background:#eafaf3;color:#16885b}
.badge.orange{background:#fff6e8;color:#b97917}
.badge.red{background:#fff0f0;color:#c33b3b}
.badge.blue{background:#eaf8ff;color:#0074a9}

/* MODAL */
dialog{width:min(650px,92vw);border:0;border-radius:18px;padding:0;box-shadow:0 30px 100px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(4,20,28,.55)}
.modal{padding:23px}
.modal h3{margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

@media(max-width:1050px){
 #app{grid-template-columns:1fr}
 aside{position:static;width:auto;min-height:auto}
 main{grid-column:1}
 .account{position:static;margin-top:15px}
 .stats{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){
 main{padding:18px 13px}
 .stats{grid-template-columns:1fr}
 .search{width:100%}
 .page-head{flex-direction:column}
 nav{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<section id="login">
 <form class="login-card" id="loginForm">
  <img src="../logo.png" alt="DigiSER">
  <h1>DigiSER Admin</h1>
  <p>Manage applicants, jobs, services, businesses, applications, payments and system updates.</p>

  <div class="field">
   <label>Admin Email</label>
   <input id="email" type="email" required>
  </div>

  <div class="field">
   <label>Password</label>
   <input id="password" type="password" required>
  </div>

  <button class="btn full">Sign in to Dashboard</button>
  <div class="error" id="loginError"></div>
 </form>
</section>


<!-- ================= APP ================= -->
<div id="app" class="hidden">

 <aside>
  <div class="brand">
   <img src="../logo.png" alt="DigiSER">
   <div>
    <b>DigiSER Admin</b>
    <small>Control Center</small>
   </div>
  </div>

  <div class="nav-title">Management</div>
  <nav id="nav"></nav>

  <div class="account">
   <b id="adminName">Admin</b>
   <span id="adminRole"></span>
   <button id="logout">Sign out</button>
  </div>
 </aside>

 <main>
  <div class="page-head">
   <div>
    <h2 id="pageTitle">Dashboard</h2>
    <p>DigiSER BD administration</p>
   </div>
   <div class="role" id="roleBadge">ADMIN</div>
  </div>

  <div id="content"></div>
 </main>

</div>


<!-- ================= EDIT MODAL ================= -->
<dialog id="editDialog">
 <form class="modal" id="editForm">
  <h3 id="modalTitle">Edit record</h3>
  <div id="modalFields"></div>
  <div class="modal-actions">
   <button type="button" class="btn light" id="closeModal">Cancel</button>
   <button type="submit" class="btn">Save changes</button>
  </div>
 </form>
</dialog>


<script type="module">

/* =========================================================
 FIREBASE
========================================================= */

import {
 initializeApp,
 getApps,
 getApp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 doc,
 setDoc,
 updateDoc,
 deleteDoc,
 getDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const firebaseConfig={
 apiKey:"AIzaSyCAc-am544-kM_qxSB6vn61Uk-8N_jpq2s",
 authDomain:"digiserbds.firebaseapp.com",
 projectId:"digiserbds",
 storageBucket:"digiserbds.firebasestorage.app",
 messagingSenderId:"543059824242",
 appId:"1:543059824242:web:71cf0227ecddf2f840fceb",
 measurementId:"G-NX8RD20E7S"
};

const app=getApps().length?getApp():initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);


/* =========================================================
 GLOBAL
========================================================= */

let currentUser=null;
let adminProfile=null;
let currentPage="dashboard";
let editingId=null;
let editingCollection=null;

const $=id=>document.getElementById(id);

const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[c]));


/* =========================================================
 COLLECTION CONFIG
========================================================= */

const modules={

 employers:{
  label:"Employers / Jobs",
  collection:"jobs",
  fields:[
   ["title","Job Title"],
   ["company","Employer / Company"],
   ["location","Location"],
   ["salary","Salary"],
   ["description","Description","textarea"],
   ["status","Status"]
  ]
 },

 services:{
  label:"Services",
  collection:"services",
  fields:[
   ["title","Service Name"],
   ["category","Category"],
   ["description","Description","textarea"],
   ["price","Price"],
   ["status","Status"]
  ]
 },

 businesses:{
  label:"Businesses",
  collection:"businesses",
  fields:[
   ["name","Business Name"],
   ["category","Category"],
   ["phone","Phone"],
   ["email","Email"],
   ["location","Location"],
   ["description","Description","textarea"],
   ["status","Status"]
  ]
 },

 employees:{
  label:"Employees",
  collection:"employees",
  fields:[
   ["name","Employee Name"],
   ["role","Role"],
   ["phone","Phone"],
   ["email","Email"],
   ["department","Department"],
   ["location","Location"],
   ["status","Status"]
  ]
 },

 blog:{
  label:"Blog",
  collection:"blog",
  fields:[
   ["title","Post Title"],
   ["category","Category"],
   ["author","Author"],
   ["excerpt","Excerpt","textarea"],
   ["content","Content","textarea"],
   ["status","Status"]
  ]
 }

};


/* =========================================================
 NAV
========================================================= */

const navItems=[
 ["dashboard","◈ Dashboard"],
 ["employers","◉ Employers / Jobs"],
 ["services","✦ Services"],
 ["businesses","▣ Businesses"],
 ["employees","◎ Employees"],
 ["applicants","◌ Applicants"],
 ["applications","✓ Applications"],
 ["payments","৳ Payments"],
 ["cvs","▤ CV Manager"],
 ["messages","✉ Messages"],
 ["blog","✎ Blog"],
 ["updates","⚡ System Updates"],
 ["admins","⚙ Admin Management"]
];

function buildNav(){
 $("nav").innerHTML="";
 navItems.forEach(([key,label])=>{
  const button=document.createElement("button");
  button.textContent=label;
  button.dataset.page=key;
  button.onclick=()=>openPage(key);
  $("nav").appendChild(button);
 });
}


/* =========================================================
 LOGIN
========================================================= */

$("loginForm").addEventListener("submit",async event=>{
 event.preventDefault();
 $("loginError").style.display="none";
 try{
  await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
 }catch(error){
  console.error(error);
  $("loginError").textContent=error.message;
  $("loginError").style.display="block";
 }
});


/* =========================================================
 AUTH
========================================================= */

onAuthStateChanged(auth,async user=>{

 if(!user){
  currentUser=null;
  adminProfile=null;
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
  return;
 }

 currentUser=user;

 try{

  const snap=await getDoc(doc(db,"adminUsers",user.uid));

  if(!snap.exists()){
   await signOut(auth);
   alert("This account is not registered as an admin.");
   return;
  }

  adminProfile={uid:user.uid,...snap.data()};

  if(adminProfile.active===false){
   await signOut(auth);
   alert("This admin account is inactive.");
   return;
  }

  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");

  $("adminName").textContent=adminProfile.name||user.email;
  $("adminRole").textContent=adminProfile.role==="super_admin"?"SUPER ADMIN":"CLIENT ADMIN";
  $("roleBadge").textContent=adminProfile.role==="super_admin"?"SUPER ADMIN":"CLIENT ADMIN";

  buildNav();
  openPage("dashboard");

 }catch(error){
  console.error(error);
  alert("Unable to load admin profile.");
 }

});

$("logout").onclick=()=>signOut(auth);


/* =========================================================
 PERMISSION
========================================================= */

function allowed(page){
 if(page==="dashboard") return true;
 if(adminProfile?.role==="super_admin") return true;
 return (adminProfile?.permissions||[]).includes(page);
}


/* =========================================================
 PAGE
========================================================= */

async function openPage(page){

 if(!allowed(page)){
  alert("You don't have permission to access this section.");
  return;
 }

 currentPage=page;

 document.querySelectorAll("#nav button").forEach(button=>{
  button.classList.toggle("active",button.dataset.page===page);
 });

 $("pageTitle").textContent=
  page==="dashboard"
  ? "Dashboard"
  : (modules[page]?.label || ({
     applicants:"Applicants",
     applications:"Applications",
     payments:"Payments",
     cvs:"CV Manager",
     messages:"Messages",
     updates:"System Updates",
     admins:"Admin Management"
    }[page]||page));

 if(modules[page]){ await renderCollection(page); return; }
 if(page==="dashboard"){ await renderDashboard(); return; }
 if(page==="applicants"){ await renderApplicants(); return; }
 if(page==="applications"){ await renderApplications(); return; }
 if(page==="payments"){ await renderPayments(); return; }
 if(page==="cvs"){ await renderCVs(); return; }
 if(page==="messages"){ await renderMessages(); return; }
 if(page==="updates"){ await renderUpdates(); return; }
 if(page==="admins"){ await renderAdmins(); return; }

}


/* =========================================================
 FIRESTORE LIST
========================================================= */

async function getCollection(name){
 const snapshot=await getDocs(collection(db,name));
 return snapshot.docs.map(item=>({_id:item.id,...item.data()}));
}


/* =========================================================
 DASHBOARD
========================================================= */

async function renderDashboard(){

 const names=["jobs","services","businesses","employees","applicantProfiles","applications","payments"];
 const counts={};
 let pendingPayments=0;

 await Promise.all(names.map(async name=>{
  try{
   const list=await getCollection(name);
   counts[name]=list.length;
   if(name==="payments"){
    pendingPayments=list.filter(p=>(p.status||"pending")==="pending").length;
   }
  }catch{
   counts[name]=0;
  }
 }));

 $("content").innerHTML=`
 <div class="stats">
  <div class="stat"><small>Employers / Jobs</small><strong style="color:var(--blue)">${counts.jobs}</strong></div>
  <div class="stat"><small>Services</small><strong style="color:var(--green)">${counts.services}</strong></div>
  <div class="stat"><small>Businesses</small><strong style="color:var(--orange)">${counts.businesses}</strong></div>
  <div class="stat"><small>Employees</small><strong style="color:var(--red)">${counts.employees}</strong></div>
  <div class="stat"><small>Applicants</small><strong>${counts.applicantProfiles}</strong></div>
  <div class="stat"><small>Applications</small><strong>${counts.applications}</strong></div>
  <div class="stat"><small>Payments</small><strong>${counts.payments}</strong></div>
  <div class="stat"><small>Pending Payments</small><strong style="color:var(--orange)">${pendingPayments}</strong></div>
 </div>`;

}


/* =========================================================
 COLLECTION RENDER (Add / Edit / Delete)
========================================================= */

async function renderCollection(page){

 const config=modules[page];
 let records=[];

 try{
  records=await getCollection(config.collection);
 }catch(error){
  console.error(error);
 }

 $("content").innerHTML=`
 <div class="toolbar">
  <button class="btn" id="addBtn">+ Add ${esc(config.label)}</button>
  <input class="search" id="search" placeholder="Search ${esc(config.label)}...">
 </div>
 <div id="tableBox"></div>`;

 function draw(list){

  if(!list.length){
   $("tableBox").innerHTML=`<div class="panel"><div class="empty">No records found.</div></div>`;
   return;
  }

  $("tableBox").innerHTML=`
  <div class="panel">
   <div class="table-wrap">
    <table>
     <thead>
      <tr>
       ${config.fields.slice(0,5).map(field=>`<th>${esc(field[1])}</th>`).join("")}
       <th>Actions</th>
      </tr>
     </thead>
     <tbody>
      ${list.map(record=>`
       <tr>
        ${config.fields.slice(0,5).map(field=>`<td>${esc(record[field[0]]||"-")}</td>`).join("")}
        <td>
         <button class="action edit" data-edit="${esc(record._id)}">Edit</button>
         <button class="action delete" data-delete="${esc(record._id)}">Delete</button>
        </td>
       </tr>`).join("")}
     </tbody>
    </table>
   </div>
  </div>`;
 }

 draw(records);

 $("search").addEventListener("input",event=>{
  const q=event.target.value.toLowerCase().trim();
  draw(records.filter(record=>JSON.stringify(record).toLowerCase().includes(q)));
 });

 $("addBtn").onclick=()=>openEditor(config,null);

 $("tableBox").addEventListener("click",async event=>{

  const edit=event.target.closest("[data-edit]");
  const del=event.target.closest("[data-delete]");

  if(edit){
   const record=records.find(item=>item._id===edit.dataset.edit);
   openEditor(config,record);
  }

  if(del){
   const id=del.dataset.delete;
   if(!confirm("Delete this record permanently?")) return;
   try{
    await deleteDoc(doc(db,config.collection,id));
    await renderCollection(page);
   }catch(error){
    console.error(error);
    alert("Delete failed: "+error.message);
   }
  }

 });

}


/* =========================================================
 EDITOR
========================================================= */

function openEditor(config,record){

 editingId=record?._id||null;
 editingCollection=config.collection;

 $("modalTitle").textContent=record?"Edit "+config.label:"Add "+config.label;

 $("modalFields").innerHTML=config.fields.map(field=>{

  const [key,label,type]=field;
  const value=record?.[key]||"";

  if(type==="textarea"){
   return`
   <div class="field">
    <label>${esc(label)}</label>
    <textarea data-key="${esc(key)}" placeholder="${esc(label)}">${esc(value)}</textarea>
   </div>`;
  }

  return`
  <div class="field">
   <label>${esc(label)}</label>
   <input data-key="${esc(key)}" value="${esc(value)}" placeholder="${esc(label)}">
  </div>`;

 }).join("");

 $("editDialog").showModal();
}


/* =========================================================
 SAVE EDIT
========================================================= */

$("editForm").addEventListener("submit",async event=>{

 event.preventDefault();

 const data={};
 document.querySelectorAll("#modalFields [data-key]").forEach(element=>{
  data[element.dataset.key]=element.value.trim();
 });

 try{

  if(editingId){

   await updateDoc(doc(db,editingCollection,editingId),{
    ...data,
    updatedAt:serverTimestamp(),
    updatedBy:currentUser.uid
   });

  }else{

   const newRef=doc(collection(db,editingCollection));
   await setDoc(newRef,{
    ...data,
    createdAt:serverTimestamp(),
    createdBy:currentUser.uid
   });

  }

  $("editDialog").close();
  await openPage(currentPage);

 }catch(error){
  console.error(error);
  alert("Save failed: "+error.message);
 }

});

$("closeModal").onclick=()=>$("editDialog").close();


/* =========================================================
 SIMPLE READ-ONLY MODULES
========================================================= */

async function renderApplicants(){

 const data=await getCollection("applicantProfiles");

 $("content").innerHTML=tableHTML(
  ["Name","Mobile","Email","Skills","CV"],
  data.map(item=>[
   esc(item.name||"-"),
   esc(item.mobile||"-"),
   esc(item.email||"-"),
   esc(item.skills||"-"),
   item.cvUrl
    ?`<a class="action edit" href="${esc(item.cvUrl)}" target="_blank" rel="noopener">View CV</a>`
    :"-"
  ])
 );

}


async function renderApplications(){

 const data=await getCollection("applications");

 $("content").innerHTML=tableHTML(
  ["Application","Applicant","Job","Status"],
  data.map(item=>[
   esc(item.id||item._id),
   esc(item.applicantName||item.name||"-"),
   esc(item.jobTitle||"-"),
   esc(item.status||"pending")
  ])
 );

}


/* =========================================================
 PAYMENTS  (manual bKash: Approve / Reject)
========================================================= */

async function renderPayments(){

 const data=await getCollection("payments");

 // newest first
 data.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));

 const rows=data.map(item=>{

  const status=item.status||"pending";
  const color=status==="success"?"green":status==="failed"?"red":"orange";

  return[
   esc(item.applicationId||"-"),
   esc(item.method||"-"),
   esc(item.amount||"-"),
   esc(item.trxId||"-"),
   esc(item.senderNumber||"-"),
   `<span class="badge ${color}">${esc(status)}</span>`,
   status==="pending"
    ?`<button class="action approve" data-pay="${esc(item._id)}" data-act="success">Approve</button>
      <button class="action delete" data-pay="${esc(item._id)}" data-act="failed">Reject</button>`
    :"-"
  ];

 });

 $("content").innerHTML=tableHTML(
  ["Application","Method","Amount","Transaction","Sender No.","Status","Actions"],
  rows
 );

 const panel=$("content").querySelector(".panel");
 if(!panel) return;

 panel.addEventListener("click",async e=>{

  const btn=e.target.closest("[data-pay]");
  if(!btn) return;

  const id=btn.dataset.pay;
  const status=btn.dataset.act;

  const ok=confirm(
   status==="success"
   ?"bKash e TrxID mile geche? Approve korben?"
   :"Ei payment reject korben?"
  );
  if(!ok) return;

  try{

   await updateDoc(doc(db,"payments",id),{
    status,
    reviewedAt:serverTimestamp(),
    reviewedBy:currentUser.uid
   });

   // related application e payment status update (na thakle skip)
   const p=data.find(x=>x._id===id);
   if(p?.applicationId){
    try{
     await updateDoc(doc(db,"applications",p.applicationId),{
      paymentStatus:status==="success"?"paid":"failed"
     });
    }catch(_){}
   }

   await renderPayments();

  }catch(err){
   console.error(err);
   alert("Update failed: "+err.message);
  }

 });

}

async function renderAdmins(){

  return;
 }

   esc(item.email||"-"),

  ])
 )}`;

}


function tableHTML(headers,rows){

 if(!rows.length){
  return`<div class="panel"><div class="empty">No records found.</div></div>`;
 }

 return`
 <div class="panel">
  <div class="table-wrap">
   <table>
    <thead>
     <tr>${headers.map(header=>`<th>${esc(header)}</th>`).join("")}</tr>
    </thead>
    <tbody>
     ${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join("")}</tr>`).join("")}
    </tbody>
   </table>
  </div>
 </div>`;

}
