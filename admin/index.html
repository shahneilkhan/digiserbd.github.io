<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigiSER Admin — Control Center</title>
<link rel="icon" href="../favicon.png">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --b:#0087c4;
  --bd:#006b9d;
  --bs:#eaf8ff;
  --g:#18a56b;
  --r:#d64545;
  --o:#e99a28;
  --bg:#f4f8fa;
  --t:#12242d;
  --m:#71818a;
  --br:#dce7ec;
  --nav:#071b25;
}

body{
  min-height:100vh;
  font-family:Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--t);
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 15% 20%,rgba(0,135,196,.12),transparent 35%),
    radial-gradient(circle at 85% 80%,rgba(24,165,107,.08),transparent 35%),
    #f4f9fb;
}

.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  padding:36px;
  box-shadow:0 30px 90px rgba(0,70,100,.13);
}

.card img{
  display:block;
  width:58px;
  height:58px;
  object-fit:contain;
  margin:0 auto 18px;
}

.card h2{
  font-size:28px;
  text-align:center;
  letter-spacing:-1px;
}

.card .sub{
  color:var(--m);
  font-size:13px;
  text-align:center;
  margin:6px 0 26px;
}

.field{margin-bottom:16px}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--br);
  border-radius:12px;
  padding:12px 14px;
  background:#fbfdfe;
  outline:none;
}

.field input,
.field select{
  height:48px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--b);
  box-shadow:0 0 0 4px rgba(0,135,196,.1);
}

.btn{
  border:0;
  border-radius:12px;
  padding:0 18px;
  min-height:46px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,var(--b),var(--bd));
}

.btn.full{
  width:100%;
  height:50px;
}

.btn.ghost{
  background:#fff;
  color:#53656e;
  border:1px solid var(--br);
}

.err{
  display:none;
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:#fff1f1;
  border:1px solid #ffd6d6;
  color:#b42c2c;
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}

.note{
  margin-top:16px;
  text-align:center;
  font-size:11px;
  color:#94a1a8;
}

/* APP */
#app{
  min-height:100vh;
  display:grid;
  grid-template-columns:250px 1fr;
}

aside{
  position:fixed;
  inset:0 auto 0 0;
  width:250px;
  background:var(--nav);
  color:#fff;
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  z-index:20;
  overflow-y:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:4px 8px 24px;
}

.brand img{
  width:38px;
  height:38px;
  object-fit:contain;
  background:#fff;
  padding:5px;
  border-radius:10px;
}

.brand b{
  display:block;
  font-size:14px;
}

.brand small{
  color:#78909a;
  font-size:10px;
}

nav{
  display:grid;
  gap:4px;
}

nav button{
  border:0;
  background:none;
  color:#9db1b9;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  font-size:13px;
  font-weight:600;
}

nav button:hover,
nav button.on{
  background:rgba(0,135,196,.2);
  color:#fff;
}

.nav-section{
  color:#536c77;
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.3px;
  padding:15px 12px 5px;
}

.me{
  margin-top:auto;
  padding:12px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  font-size:12px;
}

.me span{
  display:block;
  color:#6f8994;
  font-size:10px;
  margin:3px 0 10px;
}

.me button{
  width:100%;
  padding:9px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.1);
  background:none;
  color:#9db1b9;
}

/* MAIN */
main{
  grid-column:2;
  min-width:0;
  padding:28px 30px;
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
  margin-bottom:22px;
}

.head h1{
  font-size:26px;
  letter-spacing:-1px;
}

.head p{
  color:var(--m);
  font-size:12px;
  margin-top:4px;
}

.pill{
  padding:7px 12px;
  border-radius:999px;
  background:var(--bs);
  color:var(--b);
  font-size:11px;
  font-weight:700;
}

/* STATS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--br);
  border-radius:16px;
  padding:18px;
}

.stat small{
  color:var(--m);
  font-size:11px;
  font-weight:600;
}

.stat b{
  display:block;
  font-size:28px;
  margin-top:8px;
}

/* PANELS */
.panel{
  background:#fff;
  border:1px solid var(--br);
  border-radius:16px;
  overflow:hidden;
}

.tw{overflow:auto}

table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

th{
  text-align:left;
  font-size:11px;
  color:#82919a;
  padding:12px;
  background:#f8fbfc;
  border-bottom:1px solid var(--br);
}

td{
  padding:12px;
  border-bottom:1px solid #edf2f4;
  font-size:12px;
  vertical-align:top;
}

tr:last-child td{
  border-bottom:0;
}

.empty{
  padding:40px 20px;
  text-align:center;
  color:#8b9aa2;
  font-size:12px;
}

/* BADGES */
.bd{
  display:inline-block;
  padding:4px 9px;
  border-radius:999px;
  font-size:10px;
  font-weight:700;
}

.bd.g{background:#eafaf3;color:#16885b}
.bd.r{background:#fff0f0;color:#c33b3b}
.bd.b{background:#eaf8ff;color:#0074a9}
.bd.o{background:#fff6e8;color:#b97917}

/* BUTTONS */
.mini{
  display:inline-block;
  border:1px solid var(--br);
  background:#fff;
  color:#536770;
  border-radius:8px;
  padding:6px 10px;
  font-size:11px;
  font-weight:600;
  margin:0 4px 4px 0;
  text-decoration:none;
}

.mini:hover{
  border-color:var(--b);
  color:var(--b);
}

.mini.d{
  color:var(--r);
}

/* TOOLBAR */
.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  flex-wrap:wrap;
}

.search{
  height:44px;
  min-width:260px;
  border:1px solid var(--br);
  border-radius:11px;
  padding:0 13px;
  outline:none;
  background:#fff;
}

.search:focus{
  border-color:var(--b);
}

.note2{
  padding:14px 16px;
  border-radius:12px;
  background:#fff9eb;
  border:1px solid #f5e1af;
  color:#806221;
  font-size:12px;
  line-height:1.6;
  margin-bottom:18px;
}

/* DIALOG */
dialog{
  border:0;
  border-radius:18px;
  width:min(620px,92vw);
  padding:0;
  box-shadow:0 30px 100px rgba(0,0,0,.25);
}

dialog::backdrop{
  background:rgba(5,20,28,.55);
}

dialog form{
  padding:22px;
}

dialog h3{
  margin-bottom:16px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.full{
  grid-column:1/-1;
}

.perms{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.perms label{
  display:flex;
  gap:8px;
  align-items:center;
  border:1px solid var(--br);
  border-radius:10px;
  padding:9px;
  font-size:12px;
}

.foot{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}

/* MOBILE */
@media(max-width:1000px){
  #app{
    grid-template-columns:1fr;
  }

  aside{
    position:static;
    width:auto;
    min-height:auto;
  }

  main{
    grid-column:1;
    padding:20px 14px;
  }

  nav{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .me{
    margin-top:14px;
  }
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  nav{
    grid-template-columns:1fr;
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .search{
    width:100%;
    min-width:0;
  }

  .head{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="login">
  <form class="card" id="loginForm">
    <img src="../logo.png" alt="DigiSER">

    <h2>Welcome back</h2>

    <p class="sub">
      Sign in to your DigiSER administration account.
    </p>

    <div class="field">
      <label>Admin email</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        required
      >
    </div>

    <div class="field">
      <label>Password</label>
      <input
        id="pass"
        type="password"
        autocomplete="current-password"
        required
      >
    </div>

    <button class="btn full" type="submit">
      Sign in to Dashboard
    </button>

    <div class="err" id="err"></div>

    <p class="note">
      Access is controlled through Firebase Authentication and administrator roles.
    </p>
  </form>
</section>


<!-- ADMIN APP -->
<div id="app" class="hidden">

  <aside>

    <div class="brand">
      <img src="../logo.png" alt="DigiSER">
      <div>
        <b>DigiSER Admin</b>
        <small>Control Center</small>
      </div>
    </div>

    <nav id="nav"></nav>

    <div class="me">
      <b id="meName">Admin</b>
      <span id="meRole"></span>
      <button id="out">Sign out</button>
    </div>

  </aside>


  <main>

    <div class="head">
      <div>
        <h1 id="title">Dashboard</h1>
        <p>DigiSER BD administration</p>
      </div>

      <div class="pill" id="role"></div>
    </div>

    <div id="view"></div>

  </main>

</div>


<!-- ADMIN CREATE DIALOG -->
<dialog id="dlg">

  <form id="adminForm">

    <h3>Create new admin</h3>

    <div class="grid2">

      <div class="field">
        <label>Name</label>
        <input id="aName" required>
      </div>

      <div class="field">
        <label>Admin ID</label>
        <input id="aUser" required>
      </div>

      <div class="field full">
        <label>Email</label>
        <input id="aEmail" type="email" required>
      </div>

      <div class="field">
        <label>Temporary password</label>
        <input id="aPass" type="password" minlength="6" required>
      </div>

      <div class="field">
        <label>Role</label>

        <select id="aRole">
          <option value="admin">Client Admin</option>
          <option value="super_admin">Super Admin</option>
        </select>

      </div>

      <div class="field full">

        <label>Permissions</label>

        <div class="perms" id="perms"></div>

      </div>

    </div>

    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">
        Cancel
      </button>

      <button class="btn" id="create" type="submit">
        Create admin
      </button>
    </div>

  </form>

</dialog>


<!-- DATA MODAL -->
<dialog id="dataDlg">

  <form id="dataForm">

    <h3 id="dataTitle">Add record</h3>

    <div id="dataFields"></div>

    <div class="foot">

      <button
        type="button"
        class="btn ghost"
        id="dataCancel"
      >
        Cancel
      </button>

      <button
        class="btn"
        id="dataSave"
        type="submit"
      >
        Save
      </button>

    </div>

  </form>

</dialog>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
  initializeApp,
  getApps,
  getApp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  sendPasswordResetEmail,
  createUserWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  getDocs,
  setDoc,
  updateDoc,
  deleteDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyCAc-am544-kM_qxSB6vn61Uk-8N_jpq2s",

  authDomain:
    "digiserbds.firebaseapp.com",

  projectId:
    "digiserbds",

  storageBucket:
    "digiserbds.firebasestorage.app",

  messagingSenderId:
    "543059824242",

  appId:
    "1:543059824242:web:71cf0227ecddf2f840fceb",

  measurementId:
    "G-NX8RD20E7S"

};


const app =
  getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const auth = getAuth(app);
const db = getFirestore(app);

const ADMINS = "adminUsers";

const $ = id =>
  document.getElementById(id);

const esc = value =>
  String(value ?? "")
    .replace(
      /[&<>"']/g,
      c =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[c])
    );


/* =========================================================
   LABELS / PERMISSIONS
========================================================= */

const LABELS = {

  employers: "Employers / Jobs",

  services: "Services",

  businesses: "Businesses",

  employees: "Employees",

  applicants: "Applicants",

  applications: "Applications",

  payments: "Payments",

  cvs: "CV Manager",

  messages: "Messages",

  blog: "Blog",

  updates: "System Updates",

  admins: "Admin Management"

};


let user = null;
let me = null;
let page = "dashboard";


const isSuper =
  () => me?.role === "super_admin";


const can =
  p =>
    p === "dashboard" ||
    isSuper() ||
    (me?.permissions || []).includes(p);


/* =========================================================
   ERROR
========================================================= */

function showErr(message){

  const e = $("err");

  e.textContent = message;

  e.style.display = "block";

}


function hideErr(){

  $("err").style.display = "none";

}


/* =========================================================
   LOGIN
========================================================= */

$("loginForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    hideErr();

    try{

      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("pass").value
      );

    }catch(error){

      console.error(error);

      showErr(
        "Login failed (" +
        (error.code || "unknown") +
        ")"
      );

    }

  }
);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async currentUser => {

    if(!currentUser){

      user = null;
      me = null;

      $("login")
        .classList
        .remove("hidden");

      $("app")
        .classList
        .add("hidden");

      return;
    }

    user = currentUser;

    try{

      const snap =
        await getDoc(
          doc(
            db,
            ADMINS,
            currentUser.uid
          )
        );

      if(!snap.exists()){

        await signOut(auth);

        showErr(
          "This account is signed in but is not registered as a DigiSER administrator."
        );

        return;
      }

      me = {
        uid: currentUser.uid,
        ...snap.data()
      };

      if(me.active === false){

        await signOut(auth);

        showErr(
          "This administrator account is inactive."
        );

        return;
      }

      $("login")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      const role =
        isSuper()
          ? "SUPER ADMIN"
          : "CLIENT ADMIN";

      $("meName").textContent =
        me.name ||
        me.username ||
        currentUser.email;

      $("meRole").textContent = role;

      $("role").textContent = role;

      buildNav();

      go("dashboard");

    }catch(error){

      console.error(error);

      showErr(
        "Unable to load administrator profile (" +
        (error.code || "unknown") +
        ")"
      );

    }

  }
);


$("out").addEventListener(
  "click",
  () => signOut(auth)
);


/* =========================================================
   NAVIGATION
========================================================= */

function buildNav(){

  const items = [

    ["dashboard","◈ Dashboard"],

    ["employers","◉ Employers / Jobs"],

    ["services","✦ Services"],

    ["businesses","▣ Businesses"],

    ["employees","◎ Employees"],

    ["applicants","◌ Applicants"],

    ["applications","✓ Applications"],

    ["payments","৳ Payments"],

    ["cvs","▤ CV Manager"],

    ["messages","✉ Messages"],

    ["blog","✎ Blog"],

    ["updates","⚡ System Updates"],

    ["admins","⚙ Admin Management"]

  ];

  $("nav").innerHTML =

    items

      .filter(
        ([key]) => can(key)
      )

      .map(
        ([key,label]) =>
          `<button data-p="${key}">
             ${label}
           </button>`
      )

      .join("");


  $("nav").onclick = event => {

    const button =
      event.target.closest("button");

    if(button){

      go(button.dataset.p);

    }

  };

}


/* =========================================================
   NAVIGATION / PAGE
========================================================= */

async function go(p){

  if(!can(p)) return;

  page = p;

  document
    .querySelectorAll("#nav button")
    .forEach(
      button =>
        button.classList.toggle(
          "on",
          button.dataset.p === p
        )
    );

  $("title").textContent =
    p === "dashboard"
      ? "Dashboard"
      : LABELS[p];

  $("view").innerHTML =
    `<div class="panel">
       <div class="empty">
         Loading...
       </div>
     </div>`;

  try{

    await render[p]();

  }catch(error){

    console.error(error);

    $("view").innerHTML =

      `<div class="panel">
        <div class="empty">
          Unable to load data
          (${esc(error.code || "error")}).
          Check Firestore rules.
        </div>
      </div>`;

  }

}


/* =========================================================
   HELPERS
========================================================= */

const list =
  async collectionName =>

    (
      await getDocs(
        collection(
          db,
          collectionName
        )
      )
    )
    .docs
    .map(
      x => ({
        _id:x.id,
        ...x.data()
      })
    );


const badge =
  (text, color) =>
    `<span class="bd ${color}">
       ${esc(text)}
     </span>`;


const table =
  (headers, rows) =>

    !rows.length

      ? `<div class="panel">
           <div class="empty">
             No records found.
           </div>
         </div>`

      :

        `<div class="panel">
          <div class="tw">

            <table>

              <thead>
                <tr>
                  ${headers
                    .map(
                      h =>
                        `<th>${h}</th>`
                    )
                    .join("")}
                </tr>
              </thead>

              <tbody>

                ${rows
                  .map(
                    row =>
                      `<tr>
                        ${row
                          .map(
                            cell =>
                              `<td>${cell}</td>`
                          )
                          .join("")}
                      </tr>`
                  )
                  .join("")}

              </tbody>

            </table>

          </div>
        </div>`;


/* =========================================================
   DASHBOARD
========================================================= */

async function dashboardPage(){

  const [
    jobs,
    services,
    businesses,
    employees,
    applicants,
    applications,
    payments
  ] =
    await Promise.all([

      list("jobs"),

      list("services"),

      list("businesses"),

      list("employees"),

      list("applicantProfiles"),

      list("applications"),

      list("payments")

    ]);


  const admins =
    isSuper()
      ? (await list(ADMINS)).length
      : "-";


  $("view").innerHTML =

    `<div class="stats">

      <div class="stat">
        <small>Jobs / Employers</small>
        <b style="color:var(--b)">
          ${jobs.length}
        </b>
      </div>

      <div class="stat">
        <small>Services</small>
        <b style="color:var(--g)">
          ${services.length}
        </b>
      </div>

      <div class="stat">
        <small>Businesses</small>
        <b style="color:var(--o)">
          ${businesses.length}
        </b>
      </div>

      <div class="stat">
        <small>Employees</small>
        <b style="color:var(--r)">
          ${employees.length}
        </b>
      </div>

      <div class="stat">
        <small>Applicants</small>
        <b style="color:var(--b)">
          ${applicants.length}
        </b>
      </div>

      <div class="stat">
        <small>Applications</small>
        <b style="color:var(--g)">

/* =========================================================

========================================================= */

async function collectionPage(
  collectionName,
  columns,
  addLabel
){

  const data =
    await list(collectionName);


  const rows =
    data.map(
      item =>

        columns.map(
          column => {

            if(
              typeof column.render ===
              "function"
            ){

              return column.render(item);

            }

            return esc(
              item[column.key] ?? "-"
            );

          }
        )
    );


  $("view").innerHTML =

    `<div class="toolbar">

      <div>

        <button
          class="btn"
          id="addRecord"
        >
          + ${addLabel}
        </button>

      </div>

      <input
        class="search"
        id="tableSearch"
        placeholder="Search records..."
      >

    </div>

    <div id="collectionTable">

      ${table(
        columns.map(
          c => c.label
        ),
        rows
      )}

    </div>`;


  $("addRecord").onclick =
    () =>
      openDataDialog(
        collectionName,
        addLabel,
        columns
      );


  $("tableSearch").addEventListener(
    "input",
    event => {

      const query =
        event.target.value
          .toLowerCase()
          .trim();

      const filtered =
        data.filter(
          item =>
            JSON.stringify(item)
              .toLowerCase()
              .includes(query)
        );


      $("collectionTable").innerHTML =
        table(
          columns.map(
            c => c.label
          ),
          filtered.map(
            item =>
              columns.map(
                column => {

                  if(
                    typeof column.render ===
                    "function"
                  ){

                    return column.render(item);

                  }

                  return esc(
                    item[column.key] ?? "-"
                  );

                }
              )
          )
        );

    }
  );

}

/* =========================================================
   DATA ADD DIALOG
========================================================= */

let activeCollection = null;
let activeColumns = [];


function openDataDialog(
  collectionName,
  title,
  columns
){

  activeCollection =
    collectionName;

  activeColumns =
    columns;


  $("dataTitle").textContent =
    "Add " + title;


  const editable =
    columns.filter(
      column =>
        column.key !== "_id" &&
        !column.render
    );


  $("dataFields").innerHTML =

    editable.map(
      column =>

        `<div class="field">

          <label>
            ${esc(column.label)}
          </label>

          <input
            data-field="${esc(column.key)}"
            placeholder="${esc(column.label)}"
          >

        </div>`
    )
    .join("");


  $("dataDlg").showModal();

}


$("dataCancel").onclick =
  () =>
    $("dataDlg").close();


$("dataForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if(!activeCollection) return;

    const id =
      activeCollection
      .toUpperCase()
      .replace(/[^A-Z0-9]/g,"")
      .slice(0,6) +
      "-" +
      Date.now();


    const data = {

      id,

      createdAt:
        serverTimestamp(),

      createdBy:
        user.uid

    };


    document
      .querySelectorAll(
        "#dataFields [data-field]"
      )
      .forEach(
        input => {

          data[input.dataset.field] =
            input.value.trim();

        }
      );


    try{

      await setDoc(
        doc(
          db,
          activeCollection,
          id
        ),
        data
      );


      $("dataDlg").close();

      $("dataForm").reset();

      go(page);

    }catch(error){

      console.error(error);

      alert(
        "Unable to save (" +
        (error.code || "error") +
        ")"
      );

    }

  }
);


/* =========================================================
   ADMIN ACTIONS
========================================================= */

$("view").addEventListener(
  "click",
  async event => {

    const button =
      event.target.closest("[data-act]");

    if(
      !button ||
      !isSuper()
    ){

      return;

    }


    const {
      act,
      id,
      email,
      on
    } =
      button.dataset;


    try{

      if(act === "toggle"){

        await updateDoc(
          doc(
            db,
            ADMINS,
            id
          ),
          {
            active:
              on !== "true",

            updatedAt:
              serverTimestamp(),

            updatedBy:
              user.uid
          }
        );

      }


      if(
        act === "reset" &&
        confirm(
          "Send password reset email to " +
          email +
          "?"
        )
      ){

        await sendPasswordResetEmail(
          auth,
          email
        );

        alert(
          "Password reset email sent."
        );

        return;

      }


      if(act === "remove"){

        if(
          !confirm(
            "Remove this administrator from DigiSER?"
          )
        ){

          return;

        }

        await deleteDoc(
          doc(
            db,
            ADMINS,
            id
          )
        );

      }


      go("admins");

    }catch(error){

      console.error(error);

      alert(
        "Action failed (" +
        (error.code || "error") +
        ")"
      );

    }

  }
);

/* =========================================================
   CREATE ADMIN
========================================================= */

$("adminForm").addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    if(!isSuper()) return;


    const button =
      $("create");

    button.disabled = true;

    button.textContent =
      "Creating...";


    const role =
      $("aRole").value;


    const permissions =

      [
        ...document.querySelectorAll(
          "#perms input:checked"
        )
      ]
      .map(
        input =>
          input.value
      );


    try{

      /*
        Secondary Firebase Auth app:
        keeps the Super Admin logged in
        while creating the client account.
      */

      const name =
        "DigiSERSecondaryAuth";


      const secondaryApp =

        getApps().find(
          appInstance =>
            appInstance.name === name
        )

        ||

        initializeApp(
          firebaseConfig,
          name
        );


      const secondaryAuth =
        getAuth(
          secondaryApp
        );


      const credential =

        await createUserWithEmailAndPassword(
          secondaryAuth,
          $("aEmail")
            .value
            .trim()
            .toLowerCase(),
          $("aPass").value
        );


      await setDoc(
        doc(
          db,
          ADMINS,
          credential.user.uid
        ),
        {

          uid:
            credential.user.uid,

          name:
            $("aName")
              .value
              .trim(),

          username:
            $("aUser")
              .value
              .trim()
              .toLowerCase(),

          email:
            $("aEmail")
              .value
              .trim()
              .toLowerCase(),

          role,

          permissions:
            role === "super_admin"
              ? Object.keys(LABELS)
              : permissions,

          active:true,

          createdAt:
            serverTimestamp(),

          createdBy:
            user.uid

        }
      );


      await signOut(
        secondaryAuth
      );


      $("dlg").close();

      $("adminForm").reset();

      go("admins");


    }catch(error){

      console.error(error);

      alert(

        error.code ===
        "auth/email-already-in-use"

          ? "This email is already registered."

          :

            "Unable to create admin (" +
            (error.code ||
             error.message) +
            ")"

      );

    }finally{

      button.disabled = false;

      button.textContent =
        "Create admin";

    }

  }
);

  }catch(error){
